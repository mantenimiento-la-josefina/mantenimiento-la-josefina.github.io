name: Instalar servidor y reglas en Firebase
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', 'herramientas/**', '.github/workflows/firebase.yml']
  workflow_dispatch:
concurrency: { group: firebase, cancel-in-progress: false }
jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Credenciales de Firebase
        id: cred
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          if [ -z "$SA" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias
        if: steps.cred.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: functions
      - name: Publicar reglas de seguridad y servidor
        if: steps.cred.outputs.ok == 'true'
        run: |
          for i in 1 2; do
            if npx --yes firebase-tools@15.30.0 deploy --only firestore:rules,functions --project mantenimiento-la-josefina --non-interactive --force > salida.txt 2>&1; then cat salida.txt; exit 0; fi
            cat salida.txt
            echo "Intento $i falló, esperando 90 segundos"
            sleep 90
          done
          sed "s/\x1b\[[0-9;]*m//g" salida.txt | grep -v "ensuring required API" | grep -v "^\s*$" | tail -9 | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cred.outputs.ok == 'true'
      - name: Permitir que la app llame al servidor
        if: steps.cred.outputs.ok == 'true'
        run: |
          U=https://us-central1-mantenimiento-la-josefina.cloudfunctions.net/crearUsuario
          echo "::notice::Antes: crearUsuario responde HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{}}' $U)"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q
          SA_EMAIL=$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/sa.json'))['client_email'])")
          gcloud projects add-iam-policy-binding mantenimiento-la-josefina --member="serviceAccount:$SA_EMAIL" --role=roles/run.admin --condition=None -q >/dev/null
          sleep 30
          for f in crearusuario restablecercontrasena probarnotificacion eliminarusuario; do
            if gcloud run services add-iam-policy-binding $f --region us-central1 --project mantenimiento-la-josefina --member=allUsers --role=roles/run.invoker -q >/dev/null 2>err.txt; then echo "::notice::$f abierto"; else echo "::error::$f: $(tail -1 err.txt)"; fi
          done
          echo "::notice::Después: crearUsuario responde HTTP $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{}}' $U)"
      - name: Bloquear registro libre de cuentas
        if: steps.cred.outputs.ok == 'true' && hashFiles('herramientas/bloquear-registro.activo') != ''
        run: npm ci --no-audit --no-fund && node bloquear-registro.js
        working-directory: herramientas
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
