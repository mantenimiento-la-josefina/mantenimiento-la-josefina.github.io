<title>Mantenimiento La Josefina</title>
<style>
/* Layout: banda guinda de encabezado + columna central de tarjetas */
:root{
  --bg:#f3f5f8;--card:#ffffff;--fg:#1c2833;--muted:#67717d;--line:#e9edf1;--input:#cfd4da;--th:#f6f7f9;
  --accent:#1d4f9c;--accent-ink:#ffffff;--accent-soft:#e8effb;--accent-line:#c7d6f0;--header:#173f80;--marca-rojo:#d7262e;
  --ok:#276642;--ok-bg:#e9f5ee;--warn:#805700;--warn-bg:#fff2db;--bad:#a3262a;--bad-bg:#fde8e8;--plan:#2d4f8f;--plan-bg:#e8eefb;
  --la:#2d4f8f;--la-bg:#e8eefb;--lb:#6a3d8f;--lb-bg:#f1e8fb;--rojo:#c8102e;
  --shadow:0 2px 12px #1d24300d;
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619;--card:#1e2126;--fg:#e8eaed;--muted:#9aa3ad;--line:#2d3138;--input:#3a3f47;--th:#24282e;
  --accent:#5b8fe6;--accent-ink:#0b1a33;--accent-soft:#1b2a45;--accent-line:#2f4a78;--header:#12305f;--marca-rojo:#e5383f;
  --ok:#7fd3a1;--ok-bg:#1d3327;--warn:#f0c46b;--warn-bg:#3a2f17;--bad:#f29494;--bad-bg:#3d1f21;--plan:#9db8f0;--plan-bg:#1f2a40;
  --la:#9db8f0;--la-bg:#1f2a40;--lb:#cfa8f0;--lb-bg:#2e2140;--rojo:#e0243f;
  --shadow:0 2px 12px #0006;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:#ffffff;color:#173f80;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 10px #0000001a}
header .hin{border-bottom:0;padding-block:14px}
header .rojo{height:5px;background:#d7262e}
.banda{background:#173f80;color:#fff}
.banda:has(#sesion[hidden]){display:none}
.banda .sesion{max-width:1050px;margin:auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hin{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;text-wrap:balance}
header small{color:#5a6472}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.marca .logo-letras{height:48px;width:auto;display:block;flex-shrink:0}
.marca .divisor{width:2px;align-self:stretch;background:#173f80;flex-shrink:0}
.marca h1{font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;line-height:1.1;color:#173f80;margin:0}
.marca .plantas{display:block;font-size:12px;margin-top:4px}
.login-logo{display:block;width:100%;max-width:260px;height:auto;margin:4px auto 2px}
.login-sub{text-align:center;margin:2px 0 18px;font-weight:800;letter-spacing:.32em;color:#173f80;font-size:15px}
@media (prefers-color-scheme:dark){.login-sub{color:#8fb2ee}}
@media(max-width:480px){.marca .logo-letras{height:40px}.marca{gap:10px}.marca h1{font-size:12.5px;letter-spacing:.16em}.marca .plantas{font-size:11px}}
.sesion{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.sesion b{display:block;font-size:14px}
.sesion{color:#fff}
.sesion button{background:#ffffff22;color:#fff;border:1px solid #ffffff66;padding:7px 11px;font-size:13px}
.wrap{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
nav.grande{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button,.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-block}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
button.sec,.btn.sec{background:var(--card);color:var(--accent);border:1px solid var(--accent-line)}
button.mini{padding:6px 10px;font-size:13px;border-radius:7px}
button.peligro{background:var(--bad-bg);color:var(--bad);border:1px solid transparent}
button.falla{background:var(--rojo);color:#fff}
button.xl{font-size:18px;padding:15px 20px}
nav button{background:var(--card);color:var(--accent);border:1px solid var(--accent-line);padding:9px 13px}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:16px}
.grid .card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.kpi h2{font-size:30px;margin:0 0 2px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.plan{background:var(--plan-bg);color:var(--plan)}
.tag.neu{background:var(--th);color:var(--muted)}
.tag.la{background:var(--la-bg);color:var(--la)}
.tag.lb{background:var(--lb-bg);color:var(--lb)}
.warning{background:var(--warn-bg);padding:12px;border-radius:9px;color:var(--warn);margin-bottom:14px}
.aviso{background:var(--plan-bg);padding:12px;border-radius:9px;color:var(--plan);margin-bottom:14px}
.error{background:var(--bad-bg);padding:12px;border-radius:9px;color:var(--bad);margin-top:12px}
label{display:block;font-weight:600;margin-top:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--input);border-radius:8px;font:inherit;font-size:16px;margin-top:5px;background:var(--card);color:var(--fg)}
input:disabled{opacity:.75}
input[type=radio]{width:auto;margin:0}
textarea{min-height:90px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;margin-bottom:8px}
@media(max-width:480px){.dos{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);text-align:left;padding:10px;vertical-align:top}
th{background:var(--th);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
a{color:var(--accent)}
footer{text-align:center;color:var(--muted);padding:30px 16px}
h2{margin-top:0;text-wrap:balance}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.selmaq{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.selmaq button{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.selmaq button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.login{max-width:420px;margin:30px auto}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opciones label{margin:0;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:14px;font-size:17px;cursor:pointer;background:var(--card)}
.opciones label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
/* Alertas */
#banner:empty{display:none}
.alerta{background:var(--rojo);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 4px 18px #c8102e55}
.alerta.pulso{animation:pulso 1.2s ease-in-out infinite}

.alerta button{background:#fff;color:var(--rojo)}
.alerta button.sec{background:transparent;color:#fff;border:1px solid #ffffffaa}
.activar{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.015);box-shadow:0 4px 28px #c8102eaa}}
.fcard{border-left:6px solid var(--rojo);background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.fcard.atencion{border-left-color:#d98a00}
.fcard h3{margin:0 0 6px;font-size:18px}
.reloj{font-variant-numeric:tabular-nums;font-weight:700}
.fcard .reloj{font-size:20px;color:var(--rojo)}
.fcard.atencion .reloj{color:var(--warn)}
/* Pantalla de mantenimiento */
body.modo-pantalla header,body.modo-pantalla nav,body.modo-pantalla footer,body.modo-pantalla #banner{display:none}
body.modo-pantalla .wrap{max-width:none}
.tablero{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.tablero{grid-template-columns:1fr}}
.tablero h2{font-size:24px}
.tablero .fcard h3{font-size:24px}
.tablero .fcard .reloj{font-size:30px}
.tabhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabhead h1{margin:0;font-size:26px}
.hora{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.confirmar2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.confirmar2 button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:44px;padding:16px 10px;border-radius:16px;line-height:1}
.confirmar2 button span{font-size:20px;font-weight:800}
.confirmar2 .si{background:#1e8a4c;color:#fff}.confirmar2 .no{background:#c8102e;color:#fff}
/* Tablero de producción */
.tablero-prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:22px}
.maqtile{border-radius:16px;padding:18px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 4px 16px #0002}
.maqtile.verde{background:#1e8a4c}.maqtile.rojo{background:#c8102e;animation:pulso 1.4s ease-in-out infinite}.maqtile.amarillo{background:#f2b705;color:#2b2100}
.maqtile h3{margin:0;font-size:22px}.maqtile .est{font-size:20px;font-weight:800;letter-spacing:.02em}.maqtile small{opacity:.92;font-size:14px}
.maqtile .reloj{font-size:18px}
.maqtile.vacia{background:var(--th);color:var(--muted);box-shadow:none;min-height:80px}
.semaforo{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}.semaforo span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.semaforo i{width:14px;height:14px;border-radius:50%;display:inline-block}
/* Calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cal button.dia{background:var(--th);color:var(--fg);border:1px solid transparent;border-radius:8px;min-height:54px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.cal button.dia.fuera{opacity:.35}
.cal button.dia.hoy{border-color:var(--accent)}
.cal button.dia.sel{background:var(--accent-soft);border-color:var(--accent)}
.marcas{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.m{width:7px;height:7px;border-radius:50%;display:inline-block}
.m.ok{background:var(--ok)}.m.bad{background:var(--bad)}.m.plan{background:var(--plan)}.m.warn{background:var(--warn)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.barra{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.barra .pista{background:var(--th);border-radius:5px;height:14px;overflow:hidden}
.barra .relleno{background:var(--accent);height:100%;border-radius:5px}
.barra b{font-variant-numeric:tabular-nums;text-align:right}
.qr{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.qrbox{background:#fff;padding:10px;border-radius:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{max-width:100%}
.url{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--th);padding:8px 10px;border-radius:8px;-webkit-user-select:all;user-select:all}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.miniaturas img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#visor{position:fixed;inset:0;background:#000d;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
#visor img{max-width:100%;max-height:80vh;border-radius:10px;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px #0004;z-index:40;max-width:calc(100% - 32px)}
@media(max-width:550px){header h1{font-size:21px}.card{padding:16px}.kpi h2{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#alarma{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:#b00020;color:#fff;animation:alarmaParpadeo 1s steps(2) infinite}
#alarma[hidden]{display:none}
@keyframes alarmaParpadeo{50%{background:#5c0010}}
#alarma .caja{max-width:420px;width:100%;text-align:center}
#alarma h2{font-size:34px;margin:0 0 6px;color:#fff}
#alarma .zona{font-size:22px;font-weight:700;margin:6px 0}
#alarma p{margin:6px 0;font-size:17px;color:#fff}
#alarma button{display:block;width:100%;margin-top:14px;padding:18px;font-size:20px;font-weight:700;border-radius:14px;border:0}
#alarma .atender{background:#fff;color:#b00020}
#alarma .callar{background:transparent;color:#fff;border:2px solid #fff}
#alarma .instruccion{font-size:19px;font-weight:700;background:#ffffff22;border-radius:12px;padding:12px;margin-top:14px}
#escaner{position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center}
#escaner[hidden]{display:none}
#escaner video{width:100%;max-width:480px;border-radius:14px;border:4px solid #fff}
#escaner button{padding:16px 22px;font-size:18px;border-radius:12px;border:0;background:#fff;color:#173f80;font-weight:700}
.sem{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sem.verde{background:var(--ok-bg);color:var(--ok)}.sem.amarillo{background:var(--warn-bg);color:var(--warn)}.sem.rojo{background:var(--bad-bg);color:var(--bad)}.sem.nd{background:var(--th);color:var(--muted)}
.semtab td:first-child{white-space:nowrap}.semtab tr.niv0 td{background:var(--accent-soft);font-weight:600}.semtab tr.niv1 td:first-child{padding-left:22px}.semtab tr.niv2 td:first-child{padding-left:40px;color:var(--muted)}
tr.s-verde td:first-child{box-shadow:inset 5px 0 0 #2e9e5b}tr.s-amarillo td:first-child{box-shadow:inset 5px 0 0 #e0a800}tr.s-rojo td:first-child{box-shadow:inset 5px 0 0 #c8102e}
.ejf .filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
small.mejora{color:var(--ok);font-weight:700}small.empeora{color:var(--bad);font-weight:700}
.kpi.kverde{box-shadow:inset 0 4px 0 #2e9e5b,var(--shadow)}.kpi.kamarillo{box-shadow:inset 0 4px 0 #e0a800,var(--shadow)}.kpi.krojo,.kpi.kbad{box-shadow:inset 0 4px 0 #c8102e,var(--shadow)}
.hbar{display:grid;gap:8px}.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px}.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{background:var(--th);border-radius:6px;height:14px;overflow:hidden}.ht i{display:block;height:100%;background:var(--accent);border-radius:6px}.ht i.verde{background:#2e9e5b}.ht i.amarillo{background:#e0a800}.ht i.rojo{background:#c8102e}.hv{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.lsvg{width:100%;height:auto;max-height:260px}.lsvg .lin{stroke:var(--rojo);stroke-width:3}.lsvg .pt{fill:var(--rojo)}.lsvg .barf{fill:var(--accent);opacity:.35}.lsvg .tv{font-size:12px;font-weight:700;fill:var(--fg)}.lsvg .tx{font-size:11px;fill:var(--muted)}
.ley{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle}.ley.lin{background:var(--rojo)}.ley.barf{background:var(--accent);opacity:.5}
.rank{margin:0;padding-left:22px}.rank li{margin-bottom:10px}
.turno{border-left:6px solid var(--accent)}.turno.abierto{border-left-color:#2e9e5b}.turno button{width:100%}
.filaTurno{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.filaTurno input[type=time]{width:auto;flex:0 0 auto}.filaTurno .chk{min-width:92px;margin:0}
</style>
</head>
<body>
<header><div class="hin"><div class="marca"><img class="logo-letras" src="logo-rojo.png" alt="La Josefina" width="800" height="225"><span class="divisor"></span><div><h1>Mantenimiento</h1><small class="plantas">Plantas AM Pack · CIC · Ricaty · Flexi Pack</small></div></div></div><div class="rojo"></div><div class="banda"><div class="sesion" id="sesion" hidden></div></div></header>
<div class="wrap">

</div>

<div class="toast" id="toast" hidden></div>
<div id="alarma" hidden></div>

<script>
// ===== Configuración =====
const FIREBASE_CONFIG = {

// ===== Datos derivados =====
function registros(id){return deMaq(REG,id||'todas').filter(r=>maq(r.equipo)).slice().sort(ordenar)}
function programa(id){return deMaq(PROG,id||'todas').slice().sort((a,b)=>a.fecha.localeCompare(b.fecha))}
function estadoMaq(id){
  const ab=registros(id).filter(abierto);
  if(ab.some(r=>esFalla(r)&&r.severidad==='Paro de línea'&&r.estado!==POR_CONFIRMAR))return {txt:'Detenida',cls:'bad',det:'Falla abierta con paro de línea'};
  if(ab.some(fallaEnAtencion))return {txt:'En reparación',cls:'warn',det:'Un mecánico está atendiendo una falla'};
  if(ab.some(r=>fallaPendiente(r)))return {txt:'Operando con falla reportada',cls:'warn',det:'Hay fallas sin atender'};
  if(ab.some(fallaPorConfirmar))return {txt:'Reparada · por confirmar',cls:'plan',det:'Falta que la operadora confirme que quedó bien'};
  if(ab.some(r=>EN_ATENCION.includes(r.estado)))return {txt:'En mantenimiento',cls:'warn',det:'Trabajo en proceso'};
  return {txt:'Operando',cls:'',det:'Sin fallas abiertas'};
}
function proximo(id){
  const hs=hoy(),prog=programa(id).filter(p=>p.estado!=='Realizado');
  const venc=prog.filter(p=>p.fecha<hs);if(venc.length)return {fecha:venc[0].fecha,txt:venc[0].actividad,vencido:true};
  const fut=prog.find(p=>p.fecha>=hs);if(fut)return {fecha:fut.fecha,txt:fut.actividad};
  const f=Number((MAQCFG[id]||{}).frecuenciaDias);const ult=registros(id).find(r=>r.tipo==='Preventivo'&&r.estado==='Completado');
  if(f>0&&ult){const fe=sumarDias(ult.fecha,f);return {fecha:fe,txt:'Preventivo según frecuencia ('+f+' días)',vencido:fe<hs}}
  return null;
}
function msRef(r){return ms(r.reabiertoEn)||msCreado(r)}
function tiempos(r){const c=msCreado(r),rf=msRef(r),i=ms(r.inicioAtencion),f=ms(r.finAtencion);return {resp:i&&rf?i-rf:null,rep:f&&i?f-i:null,total:f&&c?f-c:null}}
function fallaPorConfirmar(r){return esFalla(r)&&r.estado===POR_CONFIRMAR}
function paroReal(r){if(!esFalla(r)||r.severidad!=='Paro de línea')return null;const a=msCreado(r),b=ms(r.lineaReanudaEn);return a&&b&&b>a?b-a:null}
function puedeConfirmar(){return activoP()&&['Operador','Ingeniero de procesos',PRINCIPAL,'Supervisor de mantenimiento'].includes(perfil.rol)}
function verInventario(){return vistasPermitidas().includes('inventario')}

function fotosBtn(ids,txt){return ids&&ids.length?`<button class="mini sec" data-fotos="${esc(ids.join(','))}">📷 ${txt||'Ver fotos'} (${ids.length})</button>`:''}
function detalleFalla(r){if(!esFalla(r))return '';const t=tiempos(r);let h='';
  if(r.atendidoPor)h+=`<br><small class="muted">Atendió: ${esc(r.atendidoPor)}${ms(r.inicioAtencion)?' · inicio '+hhmm(ms(r.inicioAtencion)):''}${ms(r.finAtencion)?' · fin '+hhmm(ms(r.finAtencion)):''}</small>`;
  if(t.resp!=null||t.rep!=null)h+=`<br><small class="muted">Respuesta: ${durMin(t.resp)} · Reparación: ${durMin(t.rep)} · Total: ${durMin(t.total)}</small>`;
  if(r.trabajoRealizado)h+=`<br><small><b>Trabajo realizado:</b> ${esc(r.trabajoRealizado)}</small>`;
  if(r.ajustes)h+=`<br><small><b>Ajustes:</b> ${esc(r.ajustes)}</small>`;
  if(r.confirmadoPor)h+=`<br><small class="muted">Confirmó: ${esc(r.confirmadoPor)}${ms(r.confirmadoEn)?' · '+hhmm(ms(r.confirmadoEn)):''}</small>`;
  const pr=paroReal(r);if(pr!=null)h+=`<br><small><b>Paro real de línea:</b> ${durMin(pr)} (volvió a producir ${hhmm(ms(r.lineaReanudaEn))})</small>`;
  if(r.reaperturas)h+=`<br><small class="muted">Reabierta ${r.reaperturas} vez/veces por seguir fallando${r.notaReapertura?': «'+esc(r.notaReapertura)+'»':''}</small>`;
  return h}
function filas(arr,opc={}){
  const acc=opc.acciones&&esAdmin();
  if(!arr.length)return `<p class="muted">${opc.vacio||'No hay registros.'}</p>`;
  return `<div class="scroll"><table><thead><tr><th>Fecha</th>${opc.sinMaq?'':'<th>Máquina</th>'}<th>Tipo</th><th>Actividad / falla</th><th>Responsable</th><th>Duración</th><th>Estado</th>${acc?'<th></th>':''}</tr></thead><tbody>${arr.map(r=>{const fotos=[...(r.fotos||[]),...(r.fotosCierre||[])];return `<tr>
  <td class="num">${fmt(r.fecha)}${r.hora?`<br><small class="muted">${esc(r.hora)}</small>`:''}</td>
  ${opc.sinMaq?'':`<td>${tagMaq(r.equipo)}</td>`}
  <td>${tagTipo(r.tipo)}${r.tipoFalla?`<br><small class="muted">${esc(r.tipoFalla)}</small>`:''}${r.severidad==='Paro de línea'?`<br><small class="muted">Paro de línea</small>`:''}</td>
  <td>${esc(r.actividad)}${r.refacciones?`<br><small class="muted">Refacciones: ${esc(r.refacciones)}</small>`:''}${r.observaciones?`<br><small class="muted">Obs.: ${esc(r.observaciones)}</small>`:''}${r.paro?`<br><small class="muted">Paro de línea: ${esc(r.paro)} min</small>`:''}${detalleFalla(r)}${fotos.length?'<br>'+fotosBtn(fotos):''}</td>
  <td>${esc(r.tecnico)}${r.rol?`<br><small class="muted">${esc(r.rol)}</small>`:''}</td>
  <td class="num">${r.minutos?esc(r.minutos)+' min':'—'}</td>
  <td>${tagEstado(r.estado)}${r.fechaCierre?`<br><small class="muted">Cierre: ${fmt(r.fechaCierre)}</small>`:''}</td>
  ${acc?`<td><div class="acciones" style="margin:0">${abierto(r)?`<button class="mini" data-cerrar="${esc(r.id)}">${esFalla(r)?'Cerrar falla':'Completar'}</button>`:''}<button class="mini sec" data-editar="${esc(r.id)}">Editar</button><button class="mini peligro" data-borrar="${esc(r.id)}">Eliminar</button></div></td>`:''}
  </tr>`}).join('')}</tbody></table></div>`;
}
function kpi(n,t){return `<div class="card kpi"><h2>${n}</h2><span>${t}</span></div>`}
function selMaq(actual,attr,conTodas){return `<div class="selmaq">${conTodas?`<button data-${attr}="todas" aria-pressed="${actual==='todas'}">Ambas líneas</button>`:''}${MAQUINAS.map(m=>`<button data-${attr}="${m.id}" aria-pressed="${actual===m.id}">${esc(m.zona)}</button>`).join('')}</div>`}
function opcionesMaq(sel,vacio){return (vacio&&!sel?'<option value="" selected disabled>Selecciona la máquina…</option>':'')+MAQUINAS.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.nombre)} · ${esc(m.planta)} · ${esc(m.zona)}</option>`).join('')}
function tarjetaFalla(r,opc={}){const m=maq(r.equipo),en=fallaEnAtencion(r),mia=en&&r.atendidoUid===usuario.uid;
  return `<div class="fcard ${en?'atencion':''}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(m?m.nombre+' · '+m.zona:r.equipo)}</h3><span class="reloj" data-desde="${en?ms(r.inicioAtencion)||msCreado(r):msCreado(r)}"></span></div>
  <p style="margin:0 0 6px"><b>${esc(r.tipoFalla||'Falla')}</b>${r.severidad==='Paro de línea'?' <span class="tag bad">Línea detenida</span>':''} ${tagEstado(r.estado)}</p>
  <p style="margin:0 0 6px">${esc(r.actividad)}</p>
  <small class="muted">Reportó ${esc(r.tecnico)} a las ${hhmm(msCreado(r))||esc(r.hora)}${en?` · Atiende <b>${esc(r.atendidoPor||'')}</b> desde ${hhmm(ms(r.inicioAtencion))}`:''}</small>
  ${r.fotos&&r.fotos.length?'<div class="acciones" style="margin-top:8px">'+fotosBtn(r.fotos)+'</div>':''}
  ${opc.acciones&&atiende()?(PENDIENTES.includes(r.estado)?(insiste()?`<div class="acciones"><button class="falla xl" id="abrirEscaner">📷 Escanear QR para atender</button></div><small class="muted">La falla se toma a tu nombre al escanear el código de la máquina.</small>`:`<div class="acciones"><button class="falla xl" data-atender="${esc(r.id)}">Atender falla</button></div>`):mia&&finalizando!==r.id?`<div class="acciones"><button class="xl" data-finalizar="${esc(r.id)}">Finalizar trabajo</button></div>`:''):''}
  ${mia&&finalizando===r.id?formFinalizar(r):''}</div>`}
let REF=[],MOV=[],invFiltro='',invEdit=null,invAlta=false,importPrev=null;
function refOpciones(){return REF.slice().sort((a,b)=>String(a.nombre).localeCompare(b.nombre)).map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}${x.codigo?' · '+esc(x.codigo):''} (hay ${Number(x.existencia)||0} ${esc(x.unidad||'')})</option>`).join('')}
function selRefacciones(){if(!REF.length)return '';return `<div class="refsel"><label>Refacciones del inventario</label><div class="refrows"></div><button type="button" class="mini sec agregaRef">+ Agregar refacción usada</button><small class="muted" style="display:block;margin-top:4px">Se descuentan del inventario al guardar.</small></div>`}
function filaRef(){return `<div class="refrow dos" style="grid-template-columns:1fr 90px auto;align-items:end"><div><select class="rf-id"><option value="">Elige la refacción…</option>${refOpciones()}</select></div><div><input class="rf-cant" type="number" inputmode="decimal" min="0.01" step="any" value="1" aria-label="Cantidad"></div><button type="button" class="mini peligro quitaRef" style="margin-bottom:2px">✕</button></div>`}
function leerRefs(form){const out=[];form.querySelectorAll('.refrow').forEach(rw=>{const id=rw.querySelector('.rf-id').value,c=Number(rw.querySelector('.rf-cant').value);if(id&&c>0){const x=REF.find(y=>y.id===id);if(x)out.push({id,codigo:x.codigo||'',nombre:x.nombre,unidad:x.unidad||'',cantidad:c})}});return out}
function faltante(lista){const x=lista.find(y=>{const z=REF.find(w=>w.id===y.id);return y.cantidad>(Number(z&&z.existencia)||0)});if(!x)return '';const z=REF.find(w=>w.id===x.id);return 'Solo hay '+(Number(z&&z.existencia)||0)+' '+(z&&z.unidad||'')+' de «'+x.nombre+'» en inventario. Corrige la cantidad o avisa al supervisor para que registre la entrada.'}
function textoRefs(lista,libre){return [lista.map(x=>x.nombre+' ×'+x.cantidad+(x.unidad?' '+x.unidad:'')).join(', '),libre].filter(Boolean).join(' · ')}
async function descontarRefs(lista,registroId,equipo){if(!lista.length)return;const batch=db.batch();
  lista.forEach(x=>{batch.update(db.collection('refacciones').doc(x.id),{existencia:fb.firestore.FieldValue.increment(-x.cantidad),actualizado:TS()});
    batch.set(db.collection('movimientos').doc(),{refaccion:x.id,codigo:x.codigo,nombre:x.nombre,tipo:'Salida',cantidad:x.cantidad,registro:registroId,equipo:equipo||'',uid:usuario.uid,usuario:perfil.nombre,fecha:TS()})});
  await batch.commit()}

function tarjetaConfirmar(r){const m=maq(r.equipo);
  return `<div class="fcard" style="border-left-color:var(--plan)"><h3>${esc(m?m.planta+' · '+m.zona:r.equipo)}</h3>
  <p style="margin:0 0 4px"><b>${esc(r.tipoFalla||'Falla')}</b> · reparó ${esc(r.atendidoPor||'')}${ms(r.finAtencion)?' a las '+hhmm(ms(r.finAtencion)):''}</p>
  ${puedeConfirmar()?`<p style="margin:10px 0 8px;font-size:18px;font-weight:700">¿La máquina quedó bien?</p>

document.addEventListener('click',async e=>{const b=e.target.closest('[data-conf]');if(!b)return;const r=REG.find(x=>x.id===b.dataset.id);if(!r||r.estado!==POR_CONFIRMAR)return;

  try{if(b.dataset.conf==='si'){const d={estado:'Cerrada',fechaCierre:hoy(),confirmadoPor:perfil.nombre,confirmadoUid:usuario.uid,confirmadoEn:TS()};if(r.severidad==='Paro de línea')d.lineaReanudaEn=TS();
      await db.collection('registros').doc(r.id).update(d);toast('✅ Listo. La falla quedó cerrada.')}
    else{await db.collection('registros').doc(r.id).update({estado:'Pendiente',reaperturas:(r.reaperturas||0)+1,intentos:FV.arrayUnion({atendidoPor:r.atendidoPor||'',inicio:ms(r.inicioAtencion)||0,fin:ms(r.finAtencion)||0,trabajo:r.trabajoRealizado||''}),
      atendidoUid:FV.delete(),atendidoPor:FV.delete(),inicioAtencion:FV.delete(),finAtencion:FV.delete(),trabajoRealizado:FV.delete(),ajustes:FV.delete(),reabiertoPor:perfil.nombre,reabiertoEn:TS(),avisos:FV.delete(),escalado:FV.delete()});
      toast('❌ Se avisó a los mecánicos que sigue fallando.')}}
  catch(er){toast(errTxt(er));b.closest('.confirmar2').querySelectorAll('button').forEach(x=>x.disabled=false)}});
function formFinalizar(r){return `<form id="fFinalizar" data-id="${esc(r.id)}" style="margin-top:10px"><label for="z_trab">Trabajo realizado</label><textarea id="z_trab" required maxlength="2000"></textarea>
  <label for="z_causa">Causa de la falla <small class="muted">(opcional)</small></label><input id="z_causa" maxlength="200" placeholder="Ej. Resistencia quemada, cuchilla desgastada">

function chartXml(g){const bar=g.tipo!=='line',hor=g.tipo==='bar',multi=g.series.length>1;
  const ser=g.series.map((s,i)=>`<c:ser><c:idx val="${i}"/><c:order val="${i}"/><c:tx><c:v>${xe(s.nombre)}</c:v></c:tx><c:spPr>${bar?`<a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill>`:`<a:ln w="31750" cap="rnd"><a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill><a:round/></a:ln>`}</c:spPr>${bar?'<c:invertIfNegative val="0"/>':`<c:marker><c:symbol val="circle"/><c:size val="7"/><c:spPr><a:solidFill><a:srgbClr val="${s.color}"/></a:solidFill></c:spPr></c:marker>`}${(s.colores||[]).map((c,j)=>`<c:dPt><c:idx val="${j}"/>${bar?'<c:invertIfNegative val="0"/>':''}<c:bubble3D val="0"/><c:spPr><a:solidFill><a:srgbClr val="${c}"/></a:solidFill></c:spPr></c:dPt>`).join('')}<c:dLbls><c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr><c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="900" b="1"/></a:pPr><a:endParaRPr lang="es-MX"/></a:p></c:txPr>${bar?'<c:dLblPos val="outEnd"/>':'<c:dLblPos val="t"/>'}<c:showLegendKey val="0"/><c:showVal val="1"/><c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="0"/><c:showBubbleSize val="0"/></c:dLbls><c:cat><c:strRef><c:f>${xe(g.cat.ref)}</c:f><c:strCache><c:ptCount val="${g.cat.vals.length}"/>${g.cat.vals.map((v,j)=>`<c:pt idx="${j}"><c:v>${xe(v)}</c:v></c:pt>`).join('')}</c:strCache></c:strRef></c:cat><c:val><c:numRef><c:f>${xe(s.ref)}</c:f><c:numCache><c:formatCode>General</c:formatCode><c:ptCount val="${s.vals.length}"/>${s.vals.map((v,j)=>v==null||isNaN(v)?'':`<c:pt idx="${j}"><c:v>${v}</c:v></c:pt>`).join('')}</c:numCache></c:numRef></c:val>${bar?'':'<c:smooth val="0"/>'}</c:ser>`).join('');
  const ejes=`<c:axId val="50010"/><c:axId val="50020"/>`;
  const plot=bar?`<c:barChart><c:barDir val="${hor?'bar':'col'}"/><c:grouping val="clustered"/><c:varyColors val="0"/>${ser}<c:gapWidth val="60"/>${ejes}</c:barChart>`:`<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>${ser}<c:marker val="1"/>${ejes}</c:lineChart>`;
  const txt=`<c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="900"/></a:pPr><a:endParaRPr lang="es-MX"/></a:p></c:txPr>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><c:roundedCorners val="0"/><c:chart><c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="1200" b="1"/></a:pPr><a:r><a:rPr lang="es-MX" sz="1200" b="1"/><a:t>${xe(g.titulo)}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/><c:plotArea><c:layout/>${plot}
<c:catAx><c:axId val="50010"/><c:scaling><c:orientation val="${hor?'maxMin':'minMax'}"/></c:scaling><c:delete val="0"/><c:axPos val="${hor?'l':'b'}"/><c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/>${txt}<c:crossAx val="50020"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>
<c:valAx><c:axId val="50020"/><c:scaling><c:orientation val="minMax"/><c:min val="0"/></c:scaling><c:delete val="${hor?1:0}"/><c:axPos val="${hor?'t':'l'}"/><c:majorGridlines><c:spPr><a:ln w="6350"><a:solidFill><a:srgbClr val="E3E7EC"/></a:solidFill></a:ln></c:spPr></c:majorGridlines><c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/>${txt}<c:crossAx val="50010"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx></c:plotArea>${multi?'<c:legend><c:legendPos val="b"/><c:overlay val="0"/></c:legend>':''}<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="9525"><a:solidFill><a:srgbClr val="D9DEE5"/></a:solidFill></a:ln></c:spPr></c:chartSpace>`}
async function agregarGraficas(buf,graficas,resumenes){const zip=await JSZip.loadAsync(buf);
  // Renglones de resumen marcados como «contraídos» para que Excel muestre el botón +
  for(const [n,filas] of Object.entries(resumenes||{})){const p=`xl/worksheets/sheet${n}.xml`;let x=await zip.file(p).async('string');filas.forEach(r=>{x=x.replace(new RegExp(`<row r="${r}"(?![^>]*collapsed)`),`<row r="${r}" collapsed="1"`)});x=x.replace(/(<row [^>]*outlineLevel="1"[^>]*?) collapsed="1"/g,'$1');zip.file(p,x)}
  if(!graficas.length)return zip.generateAsync({type:'arraybuffer'});
  let ct=await zip.file('[Content_Types].xml').async('string');const porHoja={};graficas.forEach(g=>{(porHoja[g.ws._n]=porHoja[g.ws._n]||[]).push(g)});let nc=0,nd=0;
  for(const [n,lista] of Object.entries(porHoja)){nd++;const anclas=[],drels=[];
    lista.forEach((g,i)=>{nc++;zip.file(`xl/charts/chart${nc}.xml`,chartXml(g));ct=ct.replace('</Types>',`<Override PartName="/xl/charts/chart${nc}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/></Types>`);
      drels.push(`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${nc}.xml"/>`);
      anclas.push(`<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${g.desde[0]}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${g.desde[1]}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${g.hasta[0]}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${g.hasta[1]}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i+2}" name="Gráfica ${i+1}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId${i+1}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`)});
    zip.file(`xl/drawings/drawing${nd}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anclas.join('')}</xdr:wsDr>`);
    zip.file(`xl/drawings/_rels/drawing${nd}.xml.rels`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drels.join('')}</Relationships>`);
    ct=ct.replace('</Types>',`<Override PartName="/xl/drawings/drawing${nd}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
    const sp=`xl/worksheets/sheet${n}.xml`,rp=`xl/worksheets/_rels/sheet${n}.xml.rels`;let sx=await zip.file(sp).async('string');
    let rx=zip.file(rp)?await zip.file(rp).async('string'):'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    rx=rx.replace('</Relationships>',`<Relationship Id="rIdGraf${nd}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${nd}.xml"/></Relationships>`);zip.file(rp,rx);
    if(!/xmlns:r=/.test(sx.slice(0,800)))sx=sx.replace('<worksheet ','<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    const tag=`<drawing r:id="rIdGraf${nd}"/>`,m=sx.match(/<(legacyDrawing|legacyDrawingHF|picture|oleObjects|controls|webPublishItems|tableParts|extLst)\b|<\/worksheet>/);sx=sx.slice(0,m.index)+tag+sx.slice(m.index);zip.file(sp,sx)}
  zip.file('[Content_Types].xml',ct);return zip.generateAsync({type:'arraybuffer',compression:'DEFLATE'})}

// ===== Turnos con QR =====
function puedeTurno(){return activoP()&&['Operador',PRINCIPAL].includes(perfil.rol)}
function verTurnos(){return activoP()&&[PRINCIPAL,'Supervisor de mantenimiento','Dirección','Gerencia','Coordinación'].includes(perfil.rol)}
function miTurnoAbierto(){return usuario?TURNOS.find(t=>t.operadorUid===usuario.uid&&t.estado==='Abierto'):null}
function txtTurno(t){return t?`${esc(t.nombre)} (${hhmm(t.a)}–${hhmm(t.b)})`:'Fuera del horario programado'}
function tarjetaTurno(){if(!puedeTurno())return '';const ab=miTurnoAbierto();const eq=maqFija||(misLineas()&&misLineas().length===1?misLineas()[0]:null);
  if(ab){const m=maq(ab.equipo)||{zona:ab.equipo,planta:''};return `<div class="card turno abierto"><p style="margin:0 0 8px"><b>🟢 Turno en curso</b> · ${esc(m.planta+' · '+m.zona)} · ${esc(ab.turno||'')} desde las ${hhmm(ms(ab.inicio))}</p>${eq&&eq!==ab.equipo?'<p class="muted" style="margin:0 0 8px">Para iniciar turno en otra máquina, primero finaliza este.</p>':''}<button class="xl sec" id="finTurno" data-id="${esc(ab.id)}">⏹ FINALIZAR TURNO</button></div>`}
  if(!eq)return '';const m=maq(eq),t=turnoEn(eq,Date.now());
  return `<div class="card turno"><p style="margin:0 0 8px"><b>${esc(m.nombre)} · ${esc(m.zona)}</b><br><small class="muted">${horario(eq)?txtTurno(t):'Esta máquina aún no tiene horario configurado'}</small></p><button class="xl" id="iniTurno" data-eq="${esc(eq)}">▶ INICIAR TURNO</button></div>`}
async function iniciarTurno(eq){const m=maq(eq),now=Date.now(),t=turnoEn(eq,now),nombre=t?t.nombre:'Fuera de horario',fecha=t?iso(new Date(t.a)):hoy();
  const id=[usuario.uid,eq,fecha,nombre].join('_').replace(/[^\w-]/g,'-');
  if(TURNOS.some(x=>x.id===id))throw new Error('Ya registraste el '+nombre.toLowerCase()+' de hoy en esta máquina. Si fue un error, pide al supervisor que lo corrija.');
  try{await db.collection('turnos').doc(id).set({equipo:eq,planta:m.planta,linea:m.zona,operadorUid:usuario.uid,operador:perfil.nombre,fecha,turno:nombre,inicio:TS(),finProgramadoMs:t?t.b:now+HORAS_TURNO*3600000,estado:'Abierto',historial:[]})}
  catch(e){if(e&&e.code==='permission-denied')throw new Error('Ese turno ya está registrado. Si fue un error, pide al supervisor que lo corrija.');throw e}}
function listaTurnosMaq(id){const l=TURNOS.filter(t=>t.equipo===id).sort((a,b)=>(ms(b.inicio)||0)-(ms(a.inicio)||0)).slice(0,20);
  return l.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Operadora</th><th>Turno</th><th>Inicio</th><th>Fin</th><th></th></tr></thead><tbody>${l.map(t=>`<tr><td>${fmt(t.fecha)}</td><td>${esc(t.operador)}</td><td>${esc(t.turno)}</td><td class="num">${hhmm(ms(t.inicio))}</td><td class="num">${t.estado==='Abierto'?'<span class="tag warn">En curso</span>':hhmm(ms(t.fin))}${t.cierre&&t.cierre!=='Operadora'?`<br><small class="muted">${esc(t.cierre)}</small>`:''}${(t.historial||[]).length?`<br><small class="muted">Corregido ${(t.historial||[]).length} vez/veces</small>`:''}</td><td><button class="mini sec" data-corturno="${esc(t.id)}">Corregir</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay turnos registrados con QR en esta máquina.</p>'}
let corrTurno=null;
function dtLocal(t){if(!t)return '';const d=new Date(t-new Date(t).getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function formCorrTurno(){const t=corrTurno==='nuevo'?null:TURNOS.find(x=>x.id===corrTurno);if(corrTurno!=='nuevo'&&!t)return '';
  return `<form id="fTurno" class="card" style="background:var(--accent-soft)"><h3 style="margin-top:0">${t?'Corregir turno de '+esc(t.operador):'Registrar turno que no se capturó'}</h3>
  ${t?'':`<div class="dos"><div><label for="t_op">Operadora</label><input id="t_op" required maxlength="120"></div><div><label for="t_nom">Turno</label><select id="t_nom">${(horario(maqSel)||{turnos:TURNOS_SUG}).turnos.map(x=>`<option>${esc(x.nombre)}</option>`).join('')}<option>Fuera de horario</option></select></div></div>`}
  <div class="dos"><div><label for="t_ini">Inicio</label><input id="t_ini" type="datetime-local" required value="${t?dtLocal(ms(t.inicio)):''}"></div><div><label for="t_fin">Fin</label><input id="t_fin" type="datetime-local" value="${t?dtLocal(ms(t.fin)):''}"></div></div>
  <label for="t_mot">Motivo de la corrección (queda en el historial)</label><input id="t_mot" required maxlength="200" placeholder="Ej. La operadora olvidó finalizar el turno">
  <div class="acciones"><button type="submit">Guardar corrección</button><button type="button" class="sec" id="cancelTurno">Cancelar</button></div><div id="tErr"></div></form>`}
function formHorario(id){const h=horario(id),dias=h?h.dias.map(Number):[1,2,3,4,5,6],tur=h?h.turnos:[];
  return `<div class="card"><h2>Horario programado de operación</h2><p class="muted">Con este horario se calculan las horas programadas y la disponibilidad. Los días y turnos que la máquina no trabaja no cuentan en contra.${h?'':' <b>Aún no hay horario guardado:</b> la disponibilidad aparece como N/D.'}</p>
  <form id="fHor"><label>Días que trabaja</label><div class="opciones">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="h_dia" value="${d}" ${dias.includes(d)?'checked':''}> ${DIAS_TXT[d]}</label>`).join('')}</div>
  <label>Turnos</label>${[0,1,2].map(i=>{const t=tur[i]||TURNOS_SUG[i],on=h?!!tur[i]:i===0;return `<div class="filaTurno"><label class="chk"><input type="checkbox" class="h_on" ${on?'checked':''}> Turno ${i+1}</label><input type="time" class="h_ini" value="${esc(t.inicio)}" aria-label="Inicio turno ${i+1}"><span>a</span><input type="time" class="h_fin" value="${esc(t.fin)}" aria-label="Fin turno ${i+1}"></div>`}).join('')}
  <div class="acciones"><button type="submit">Guardar horario</button></div><div id="hErr"></div></form></div>`}
function formUmbrales(){const u=umbrales();return `<div class="card"><h2>Semáforo de desempeño (todas las máquinas)</h2><p class="muted">Porcentaje de horas programadas perdidas por paros en el periodo.</p><form id="fUmb" class="dos"><div><label for="u_v">🟢 Verde si pierde menos de (%)</label><input id="u_v" type="number" min="1" max="98" step="0.5" value="${u.verde}"></div><div><label for="u_r">🔴 Rojo desde (%)</label><input id="u_r" type="number" min="2" max="99" step="0.5" value="${u.rojo}"></div><div style="grid-column:1/-1"><small class="muted">Entre ambos valores, 🟡 amarillo. Actual: verde = disponibilidad mayor a ${100-u.verde}%, rojo = ${100-u.rojo}% o menos.</small></div><div><button type="submit">Guardar semáforo</button></div></form></div>`}
function enlazarTurnos(){
  const it=$('iniTurno');if(it)it.onclick=async()=>{it.disabled=true;try{await iniciarTurno(it.dataset.eq);toast('🟢 Turno iniciado.')}catch(e){toast(e.message||errTxt(e));it.disabled=false}};
  const ft=$('finTurno');if(ft)ft.onclick=async()=>{ft.disabled=true;try{await db.collection('turnos').doc(ft.dataset.id).update({estado:'Cerrado',fin:TS(),cierre:'Operadora'});toast('⏹ Turno finalizado. ¡Buen trabajo!')}catch(e){toast(errTxt(e));ft.disabled=false}};
  const fh=$('fHor');if(fh)fh.onsubmit=async ev=>{ev.preventDefault();const dias=[...fh.querySelectorAll('[name=h_dia]:checked')].map(x=>Number(x.value)),turnos=[];
    fh.querySelectorAll('.filaTurno').forEach((rw,i)=>{if(rw.querySelector('.h_on').checked)turnos.push({nombre:'Turno '+(i+1),inicio:rw.querySelector('.h_ini').value,fin:rw.querySelector('.h_fin').value})});
    if(!dias.length||!turnos.length||turnos.some(t=>!t.inicio||!t.fin||t.inicio===t.fin)){$('hErr').innerHTML='<p class="error">Elige al menos un día y un turno con hora de inicio y fin distintas.</p>';return}
    const prev=horarios(maqSel).map(h=>({desde:h.desde||0,dias:h.dias,turnos:h.turnos,por:h.por||''}));const desde=prev.length?inicioDia(Date.now()):0;
    const lista=prev.filter(h=>h.desde<desde).concat([{desde,dias,turnos,por:perfil.nombre,guardado:Date.now()}]);
    try{await db.collection('maquinas').doc(maqSel).set({horarios:lista},{merge:true});toast('Horario guardado.');render(true)}catch(e){$('hErr').innerHTML=`<p class="error">${esc(errTxt(e))}</p>`}};
  const fu=$('fUmb');if(fu)fu.onsubmit=async ev=>{ev.preventDefault();const v=Number($('u_v').value),r=Number($('u_r').value);if(!(v>0&&r>v&&r<100)){toast('El valor rojo debe ser mayor que el verde.');return}
    try{await db.collection('config').doc('indicadores').set({verde:v,rojo:r,por:perfil.nombre,actualizado:TS()},{merge:true});toast('Semáforo guardado.');render(true)}catch(e){toast(errTxt(e))}};
  document.querySelectorAll('[data-corturno]').forEach(b=>b.onclick=()=>{corrTurno=b.dataset.corturno;render(true)});
  const nt=$('nuevoTurno');if(nt)nt.onclick=()=>{corrTurno='nuevo';render(true)};
  const ct=$('cancelTurno');if(ct)ct.onclick=()=>{corrTurno=null;render(true)};
  const ftu=$('fTurno');if(ftu)ftu.onsubmit=async ev=>{ev.preventDefault();const ini=$('t_ini').value?new Date($('t_ini').value):null,fi=$('t_fin').value?new Date($('t_fin').value):null,mot=$('t_mot').value.trim();
    if(!ini||(fi&&fi<=ini)){$('tErr').innerHTML='<p class="error">Revisa las horas: el fin debe ser después del inicio.</p>';return}
    const ent={por:perfil.nombre,uid:usuario.uid,en:Date.now(),motivo:mot};
    try{if(corrTurno==='nuevo'){const m=maq(maqSel);await db.collection('turnos').doc().set({equipo:maqSel,planta:m.planta,linea:m.zona,operadorUid:'',operador:$('t_op').value.trim(),fecha:iso(ini),turno:$('t_nom').value,inicio:ini,fin:fi||null,finProgramadoMs:fi?fi.getTime():ini.getTime()+HORAS_TURNO*3600000,estado:fi?'Cerrado':'Abierto',cierre:'Capturado por '+perfil.nombre,historial:[Object.assign(ent,{accion:'Alta manual'})]})}
      else{const t=TURNOS.find(x=>x.id===corrTurno);ent.antes={inicio:ms(t.inicio)||null,fin:ms(t.fin)||null};ent.despues={inicio:ini.getTime(),fin:fi?fi.getTime():null};
        await db.collection('turnos').doc(t.id).update({inicio:ini,fin:fi||null,estado:fi?'Cerrado':'Abierto',cierre:fi?'Corregido por '+perfil.nombre:(t.cierre||''),historial:(t.historial||[]).concat([ent])})}
      corrTurno=null;toast('Corrección guardada en el historial.');render(true)}catch(e){$('tErr').innerHTML=`<p class="error">${esc(errTxt(e))}</p>`}}}

function enlazar(){
  enlazarEjecutivo();enlazarTurnos();
  const f=$('form');
  if(f)f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('button[type=submit]');b.disabled=true;$('fErr').innerHTML='';
    const adm=esAdmin(),est=$('m_est').value;
    const d={equipo:$('m_maq').value,tipo:$('m_tipo').value,actividad:$('m_act').value.trim(),refacciones:$('m_ref').value.trim(),minutos:num($('m_min').value),estado:est,observaciones:$('m_obs').value.trim()};
    try{
      if(editId){const ed=REG.find(r=>r.id===editId);Object.assign(d,{fecha:$('m_fecha').value,tecnico:$('m_tec').value.trim(),editadoPor:perfil.nombre,editadoEn:TS()});
        if($('m_tf'))Object.assign(d,{tipoFalla:$('m_tf').value,causa:$('m_causa').value.trim(),trabajoRealizado:$('m_trab').value.trim(),ajustes:$('m_aj').value.trim()});
        if(CERRADOS.includes(est)&&!ed.fechaCierre)d.fechaCierre=hoy();
        await db.collection('registros').doc(editId).update(d);toast('Cambios guardados.');ir('trabajos');return}
      Object.assign(d,{fecha:adm?$('m_fecha').value:hoy(),hora:horaAhora(),tecnico:adm?$('m_tec').value.trim():perfil.nombre,tecnicoUid:usuario.uid,rol:perfil.rol,creadoEn:TS()});
      if(CERRADOS.includes(est))d.fechaCierre=d.fecha;

async function guardarUsuario(ev){ev.preventDefault();const f=ev.target,b=f.querySelector('button[type=submit]');b.disabled=true;$('uErr').innerHTML='';
  const uid=f.dataset.uid,num=$('u_num').value.trim();

  if(num&&!/^[0-9]{1,10}$/.test(num)){$('uErr').innerHTML='<p class="error">El número de empleado solo puede tener dígitos.</p>';b.disabled=false;return}
  try{
    if(uid){await db.collection('usuarios').doc(uid).update(Object.assign(datos,{modificadoPor:usuario.uid,modificadoEn:TS()}));usrEdit=null;toast('Datos de '+datos.nombre+' actualizados.');render(true);return}

    else{const sec=fb.apps.find(a=>a.name==='altas')||fb.initializeApp(FIREBASE_CONFIG,'altas');
    const c=await sec.auth().createUserWithEmailAndPassword(correoDe(u),$('u_pass').value);const nuid=c.user.uid;await sec.auth().signOut();
    await db.collection('usuarios').doc(nuid).set(Object.assign(datos,{usuario:u,creadoPor:usuario.uid,creadoEn:TS()}));}
    usrAlta=false;toast('Usuario «'+u+'» creado para '+datos.nombre+'.');render(true)
  }catch(e){$('uErr').innerHTML=`<p class="error">${esc(errTxt(e))}</p>`;b.disabled=false}}

// ===== Respaldo descargable =====
function descargarRespaldo(){const limpio=o=>JSON.parse(JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&typeof v.toMillis==='function'?new Date(v.toMillis()).toISOString():v));
  const data={generado:new Date().toISOString(),por:perfil.nombre,registros:limpio(REG),programa:limpio(PROG),maquinas:limpio(MAQCFG),refacciones:limpio(REF),movimientos:limpio(MOV),usuarios:limpio(USUARIOS.map(u=>({nombre:u.nombre,usuario:u.usuario,numEmpleado:u.numEmpleado,rol:u.rol,planta:u.planta,linea:u.linea,activo:u.activo})))};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='respaldo_mantenimiento_'+hoy()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
// ===== Exportar =====
function exportar(){const keys=['fecha','hora','equipo','linea','tipo','tipoFalla','severidad','actividad','tecnico','rol','atendidoPor','inicio','fin','respuesta_min','reparacion_min','trabajoRealizado','ajustes','refacciones','minutos','estado','fechaCierre','confirmadoPor','paroReal_min','reaperturas','observaciones'];
  const val=(r,k)=>{const t=tiempos(r);if(k==='linea')return (maq(r.equipo)||{}).zona;if(k==='inicio')return hhmm(ms(r.inicioAtencion));if(k==='fin')return hhmm(ms(r.finAtencion));if(k==='paroReal_min'){const p=paroReal(r);return p!=null?Math.round(p/60000):''}if(k==='respuesta_min')return t.resp!=null?Math.round(t.resp/60000):'';if(k==='reparacion_min')return t.rep!=null?Math.round(t.rep/60000):'';return r[k]||''};
  const csv='﻿'+[keys,...filtrar().map(r=>keys.map(k=>val(r,k)))].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mantenimiento_la_josefina_dpc_'+hoy()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Enlace copiado.')}catch(e){const u=$('qrurl');if(u){const r=document.createRange();r.selectNodeContents(u);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecciona y copia el enlace.')}}

// ===== QR =====
function urlQR(id){return URL_BASE+'?m='+maq(id).clave}
function pintarQR(id,boxId,size){const box=$(boxId);if(!box)return;box.innerHTML='';
  if(typeof QRCode==='undefined'){box.innerHTML='<small class="muted">No se pudo cargar el generador de QR.</small>';return}
  new QRCode(box,{text:urlQR(id),width:size||180,height:size||180,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function qrDataURL(id){const tmp=document.createElement('div');tmp.id='qrtmp';tmp.style.position='absolute';tmp.style.left='-9999px';document.body.appendChild(tmp);pintarQR(id,'qrtmp',512);
  const c=tmp.querySelector('canvas');const m=maq(id);const out=document.createElement('canvas');out.width=640;out.height=760;const g=out.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,640,760);g.imageSmoothingEnabled=false;if(c)g.drawImage(c,64,64,512,512);
  g.fillStyle='#173f80';g.font='bold 34px -apple-system,Arial';g.textAlign='center';g.fillText(m.nombre+' · '+m.zona,320,630);
  g.fillStyle='#1c2833';g.font='26px -apple-system,Arial';g.fillText('La Josefina DPC · Planta '+m.planta+' · '+m.id,320,675);g.font='22px -apple-system,Arial';g.fillText('Escanea para reportar una falla en esta máquina',320,715);
  tmp.remove();return out.toDataURL('image/png')}
function bajarQR(id){const a=document.createElement('a');a.href=qrDataURL(id);a.download='QR_La_Josefina_'+maq(id).zona.replace(' ','_')+'.png';document.body.appendChild(a);a.click();a.remove()}
function imprimirQR(){const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir.');return}
  w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Códigos QR · La Josefina DPC</title><style>body{font-family:-apple-system,Arial;margin:0;padding:20px;text-align:center}img{width:300px;max-width:90%;margin:10px;border:1px dashed #999}@media print{img{page-break-inside:avoid}}</style></head><body>'+MAQUINAS.map(m=>'<img src="'+qrDataURL(m.id)+'" alt="QR '+m.zona+'">').join('')+'<script>setTimeout(function(){window.print()},400)<\/script></body></html>');w.document.close()}

iniciar();
</script>
