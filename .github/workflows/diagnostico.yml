name: Diagnóstico del servidor
on: workflow_dispatch
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Últimos errores
        env: { SA: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" -q
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="crearusuario" AND timestamp>="2026-10-20T22:19:30Z"' --project mantenimiento-la-josefina --freshness=2h --limit=9 --order=desc --format='value(timestamp,severity,httpRequest.status,textPayload,jsonPayload.message)' > out.txt 2>&1 || true
          sed 's/\t/ | /g' out.txt | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          rm -f "$RUNNER_TEMP/sa.json"
