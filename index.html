/* Layout: banda guinda de encabezado + columna central de tarjetas */
:root{
  --bg:#f3f5f8;--card:#ffffff;--fg:#1c2833;--muted:#67717d;--line:#e9edf1;--input:#cfd4da;--th:#f6f7f9;
  --accent:#1d4f9c;--accent-ink:#ffffff;--accent-soft:#e8effb;--accent-line:#c7d6f0;--header:#173f80;--marca-rojo:#d7262e;

  --la:#2d4f8f;--la-bg:#e8eefb;--lb:#6a3d8f;--lb-bg:#f1e8fb;--rojo:#c8102e;
  --shadow:0 2px 12px #1d24300d;
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{

  --ok:#7fd3a1;--ok-bg:#1d3327;--warn:#f0c46b;--warn-bg:#3a2f17;--bad:#f29494;--bad-bg:#3d1f21;--plan:#9db8f0;--plan-bg:#1f2a40;
  --la:#9db8f0;--la-bg:#1f2a40;--lb:#cfa8f0;--lb-bg:#2e2140;--rojo:#e0243f;
  --shadow:0 2px 12px #0006;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--header);color:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:5px solid var(--marca-rojo)}
.hin{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;text-wrap:balance}
header small{opacity:.85}
.sesion{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.sesion b{display:block;font-size:14px}
.sesion button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:7px 11px;font-size:13px}
.wrap{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
nav.grande{display:grid;grid-template-columns:1fr 1fr;gap:12px}
nav.grande button{font-size:19px;padding:18px 14px}

button,.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-block}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
button.sec,.btn.sec{background:var(--card);color:var(--accent);border:1px solid var(--accent-line)}
button.mini{padding:6px 10px;font-size:13px;border-radius:7px}
button.peligro{background:var(--bad-bg);color:var(--bad);border:1px solid transparent}
button.falla{background:var(--rojo);color:#fff}
button.xl{font-size:18px;padding:15px 20px}
nav button{background:var(--card);color:var(--accent);border:1px solid var(--accent-line);padding:9px 13px}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:16px}
.grid .card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.kpi h2{font-size:30px;margin:0 0 2px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.plan{background:var(--plan-bg);color:var(--plan)}
.tag.neu{background:var(--th);color:var(--muted)}
.tag.la{background:var(--la-bg);color:var(--la)}
.tag.lb{background:var(--lb-bg);color:var(--lb)}
.warning{background:var(--warn-bg);padding:12px;border-radius:9px;color:var(--warn);margin-bottom:14px}
.aviso{background:var(--plan-bg);padding:12px;border-radius:9px;color:var(--plan);margin-bottom:14px}
.error{background:var(--bad-bg);padding:12px;border-radius:9px;color:var(--bad);margin-top:12px}
label{display:block;font-weight:600;margin-top:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--input);border-radius:8px;font:inherit;font-size:16px;margin-top:5px;background:var(--card);color:var(--fg)}
input:disabled{opacity:.75}
input[type=radio]{width:auto;margin:0}
textarea{min-height:90px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;margin-bottom:8px}

table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);text-align:left;padding:10px;vertical-align:top}
th{background:var(--th);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
a{color:var(--accent)}
footer{text-align:center;color:var(--muted);padding:30px 16px}
h2{margin-top:0;text-wrap:balance}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.selmaq{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.selmaq button{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.selmaq button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.login{max-width:420px;margin:30px auto}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opciones label{margin:0;display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:10px;padding:14px;font-size:17px;cursor:pointer;background:var(--card)}
.opciones label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

#banner:empty{display:none}
.alerta{background:var(--rojo);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 4px 18px #c8102e55}
.alerta.pulso{animation:pulso 1.2s ease-in-out infinite}
.alerta b{font-size:17px}
.alerta button{background:#fff;color:var(--rojo)}
.alerta button.sec{background:transparent;color:#fff;border:1px solid #ffffffaa}
.activar{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.015);box-shadow:0 4px 28px #c8102eaa}}
.fcard{border-left:6px solid var(--rojo);background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.fcard.atencion{border-left-color:#d98a00}
.fcard h3{margin:0 0 6px;font-size:18px}
.reloj{font-variant-numeric:tabular-nums;font-weight:700}
.fcard .reloj{font-size:20px;color:var(--rojo)}
.fcard.atencion .reloj{color:var(--warn)}

body.modo-pantalla header,body.modo-pantalla nav,body.modo-pantalla footer,body.modo-pantalla #banner{display:none}
body.modo-pantalla .wrap{max-width:none}
.tablero{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.tablero h2{font-size:24px}
.tablero .fcard h3{font-size:24px}
.tablero .fcard .reloj{font-size:30px}

.tabhead h1{margin:0;font-size:26px}
.hora{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

.maqtile{border-radius:16px;padding:18px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 4px 16px #0002}
.maqtile.verde{background:#1e8a4c}.maqtile.rojo{background:#c8102e;animation:pulso 1.4s ease-in-out infinite}.maqtile.amarillo{background:#f2b705;color:#2b2100}
.maqtile h3{margin:0;font-size:22px}.maqtile .est{font-size:20px;font-weight:800;letter-spacing:.02em}.maqtile small{opacity:.92;font-size:14px}
.maqtile .reloj{font-size:18px}
.maqtile.vacia{background:var(--th);color:var(--muted);box-shadow:none;min-height:80px}

.semaforo i{width:14px;height:14px;border-radius:50%;display:inline-block}

.cal button.dia.fuera{opacity:.35}
.cal button.dia.hoy{border-color:var(--accent)}
.cal button.dia.sel{background:var(--accent-soft);border-color:var(--accent)}

.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.barra{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.barra .pista{background:var(--th);border-radius:5px;height:14px;overflow:hidden}
.barra .relleno{background:var(--accent);height:100%;border-radius:5px}
.barra b{font-variant-numeric:tabular-nums;text-align:right}

.qrbox{background:#fff;padding:10px;border-radius:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{max-width:100%}
.url{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--th);padding:8px 10px;border-radius:8px;-webkit-user-select:all;user-select:all}
.miniaturas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.miniaturas img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#visor{position:fixed;inset:0;background:#000d;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
#visor img{max-width:100%;max-height:80vh;border-radius:10px;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px #0004;z-index:40;max-width:calc(100% - 32px)}

#alarma .zona{font-size:22px;font-weight:700;margin:6px 0}

</style>
</head>

// ===== Utilidades =====
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return iso(new Date())}
function horaAhora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function hhmm(ms){if(!ms)return '—';const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function aFecha(s){return new Date(s+'T12:00:00')}
function fmt(s){if(!s)return '—';const d=aFecha(s);return isNaN(d)?esc(s):d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function sumarDias(s,n){const d=aFecha(s);d.setDate(d.getDate()+Number(n));return iso(d)}
function dur(ms){if(ms==null||isNaN(ms)||ms<0)return '—';const s=Math.floor(ms/1000);if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min '+String(s%60).padStart(2,'0')+' s';const h=Math.floor(m/60);return h+' h '+String(m%60).padStart(2,'0')+' min'}
function durMin(ms){if(ms==null||isNaN(ms)||ms<0)return '—';const m=Math.round(ms/60000);if(m<60)return m+' min';return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,3200)}
function maq(id){return MAQUINAS.find(m=>m.id===id)}
function maqPorClave(c){return MAQUINAS.find(m=>m.clave===String(c||'').toUpperCase())}
function tagMaq(id){const m=maq(id);if(!m)return `<span class="tag neu">${esc(id)}</span>`;return `<span class="tag ${m.clave==='A'?'la':'lb'}">${esc(m.zona)}</span>`}
function tagEstado(e){if(CERRADOS.includes(e))return `<span class="tag">${esc(e)}</span>`;if(EN_ATENCION.includes(e))return `<span class="tag warn">${esc(e)}</span>`;return `<span class="tag bad">${esc(e||'Pendiente')}</span>`}
function tagTipo(t){if(t==='Reporte de falla')return `<span class="tag bad">Falla</span>`;if(t==='Correctivo')return `<span class="tag warn">Correctivo</span>`;if(t==='Preventivo')return `<span class="tag plan">Preventivo</span>`;return `<span class="tag neu">${esc(t)}</span>`}
function activoP(){return !!perfil&&perfil.activo===true}
function esPrincipal(){return activoP()&&perfil.rol===PRINCIPAL}
function esAdmin(){return activoP()&&ROLES_GESTION.includes(perfil.rol)} // puede modificar registros y configuración
function esSupervisor(){return activoP()&&ROLES_SUPERVISION.includes(perfil.rol)}
function esCoordinacion(){return activoP()&&perfil.rol==='Coordinación'}
function grupo(){return esPrincipal()?'principal':esAdmin()?'gestor':esCoordinacion()?'coordinacion':esSupervisor()?'supervisor':(perfil&&perfil.rol)}
const ROL_TXT={'Coordinación':'Coordinación de Producción'};function rolTxt(r){return ROL_TXT[r]||r}
function misLineas(){const l=perfil&&perfil.linea;return !l||l==='todas'?null:[l]}
function deMiLinea(r){const l=misLineas();if(l)return l.includes(r.equipo);const pl=perfil&&perfil.planta,m=maq(r.equipo);return !pl||!m||m.planta===pl}
function esMecanico(){return activoP()&&ROLES_MANTTO.includes(perfil.rol)}
function atiende(){return esAdmin()||esMecanico()}
function insiste(){return esMecanico()}
function vistasPermitidas(){return VISTAS[grupo()]||['cuenta']}
function inicioRol(){return esCoordinacion()?'tablero':esSupervisor()?'panel':esMecanico()?'alertas':'falla'}
function correoDe(u){u=String(u||'').replace(/\s+/g,'').toLowerCase();return u+'@'+DOMINIO}
function usuarioDe(correo){return String(correo||'').replace('@'+DOMINIO,'')}
function ms(t){try{if(t&&t.toMillis)return t.toMillis()}catch(e){}return null}
function msCreado(r){return ms(r.creadoEn)||Date.parse(r.creado||'')||0}
function ordenar(a,b){return (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||''))||msCreado(b)-msCreado(a)}
function abierto(r){return !CERRADOS.includes(r.estado)}
function esFalla(r){return r.tipo==='Reporte de falla'}
function fallaPendiente(r){return esFalla(r)&&PENDIENTES.includes(r.estado)}
function fallaEnAtencion(r){return esFalla(r)&&EN_ATENCION.includes(r.estado)}
function deMaq(arr,id){return id==='todas'?arr:arr.filter(r=>r.equipo===id)}
function errTxt(e){const c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'Usuario o contraseña incorrectos.';
  if(c==='auth/too-many-requests')return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
  if(c==='auth/email-already-in-use')return 'Ese nombre de usuario ya está ocupado. Elige otro.';
  if(c==='auth/weak-password')return 'La contraseña debe tener al menos 6 caracteres.';
  if(c==='auth/invalid-email')return 'El usuario solo puede tener letras sin acento, números, punto, guion o guion bajo.';
  if(c==='auth/network-request-failed'||c==='unavailable')return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  if(c==='permission-denied')return 'No tienes permiso para esta acción.';
  if(c==='auth/requires-recent-login')return 'Por seguridad, cierra sesión, vuelve a entrar y repite el cambio.';
  if(c==='tomada')return 'Otro mecánico ya tomó esta falla.';
  if(String(c).startsWith('functions/'))return (e.message&&e.message!=='INTERNAL'?e.message:'El servidor no respondió. Inténtalo de nuevo en un momento.');
  return 'Ocurrió un error ('+(c||(e&&e.message)||'desconocido')+').'}
function llamar(nombre,datos){return fb.app().functions('us-central1').httpsCallable(nombre)(datos).then(r=>r.data)}
// ===== Notificaciones push (teléfono bloqueado) =====
function esIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function enPantallaInicio(){return window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function pushSoportado(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function estadoPush(){if(!VAPID_KEY||!SERVIDOR_LISTO)return 'no-listo';if(!pushSoportado())return esIOS()&&!enPantallaInicio()?'ios-instalar':'no-soportado';if(Notification.permission==='denied')return 'bloqueado';if(Notification.permission==='granted'&&LS.get('push_uid','')===(usuario&&usuario.uid))return 'activo';return 'pendiente'}
async function activarPush(silencioso){
  try{if(estadoPush()==='ios-instalar'){if(!silencioso)toast('En iPhone: Compartir → «Agregar a inicio», abre la app desde el ícono y vuelve a tocar «Activar notificaciones».');return false}
    if(!pushSoportado()){if(!silencioso)toast('Este navegador no permite notificaciones. Usa Chrome (Android) o Safari (iPhone desde la pantalla de inicio).');return false}
    const perm=Notification.permission==='granted'?'granted':(silencioso?Notification.permission:await Notification.requestPermission());
    if(perm!=='granted'){if(!silencioso)toast(perm==='denied'?'Las notificaciones están bloqueadas. Actívalas en los ajustes del navegador para esta página.':'No se dio permiso para notificaciones.');pintarBanner();return false}
    const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');await navigator.serviceWorker.ready;
    const token=await fb.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)throw new Error('sin token');
    await db.collection('tokens').doc(token).set({uid:usuario.uid,token,rol:perfil.rol,nombre:perfil.nombre,dispositivo:navigator.userAgent.slice(0,160),actualizado:TS()});
    LS.set('push_uid',usuario.uid);LS.set('push_token',token);
    if(!silencioso)toast('✅ Notificaciones activadas en este teléfono.');pintarBanner();if(vista==='cuenta')render(true);return true
  }catch(e){console.warn(e);if(!silencioso)toast('No se pudieron activar las notificaciones ('+((e&&(e.code||e.message))||'error')+').');return false}}
async function quitarPushDeEsteTelefono(){const t=LS.get('push_token','');LS.set('push_uid','');if(t&&db){try{await db.collection('tokens').doc(t).delete()}catch(e){}}}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ===== Dirección (QR y enlaces) =====
function leerDireccion(){
  const q=new URLSearchParams(location.search);const h=(location.hash||'').replace('#','');
  const m=maqPorClave(q.get('m'))||MAQUINAS.find(x=>x.id===q.get('equipo'));
  if(m)return h==='ficha'?{vista:'ficha',maq:m.id}:{vista:'qr',maq:m.id};
  if(h==='ficha')return {vista:'ficha',maq:MAQUINAS[0].id};
  const f=h.match(/^ficha-([ab])$/i);if(f)return {vista:'ficha',maq:maqPorClave(f[1]).id};
  if(h)return {vista:h};
  return null;
}
function escribirDireccion(){
  try{const conMaq=vista==='falla'&&maqFija?maqFija:vista==='ficha'?maqSel:null;const rel=conMaq?'?m='+maq(conMaq).clave+(vista==='ficha'?'#ficha':''):'#'+vista;
    history.replaceState(null,'',(location.origin+location.pathname===URL_BASE?URL_BASE:'')+rel)}catch(e){}
}

// ===== Arranque =====
function iniciar(){
  if(typeof firebase==='undefined'){$('app').innerHTML='<div class="card"><h2>Sin conexión</h2><p>No se pudo cargar el sistema. Revisa tu internet y recarga la página.</p></div>';return}
  fb=firebase;
  const app=fb.apps.length?fb.app():fb.initializeApp(FIREBASE_CONFIG);
  auth=app.auth();db=app.firestore();
  destino=leerDireccion();
  auth.onAuthStateChanged(u=>{usuario=u;cerrarSubs();perfil=null;REG=[];PROG=[];MAQCFG={};USUARIOS=[];primeraCarga=true;pintarBanner();
    if(!u){pantallaLogin();return}
    $('app').innerHTML='<div class="card"><p class="muted">Cargando tu cuenta…</p></div>';
    let listo=false,rolAntes=null;
    subs.push(db.collection('usuarios').doc(u.uid).onSnapshot(s=>{
      perfil=s.exists?s.data():null;
      if(!perfil||perfil.activo!==true){cerrarSubs(true);listo=false;pantallaSinAcceso();return}
      if(!listo||rolAntes!==perfil.rol){cerrarSubs(true);listo=true;rolAntes=perfil.rol;suscribir();entrar()}else{pintarSesion();render()}
    },e=>{pantallaSinAcceso(errTxt(e))}));
  });
}
function cerrarSubs(dejarPerfil){const keep=dejarPerfil?subs.slice(0,1):[];subs.slice(keep.length).forEach(f=>{try{f()}catch(e){}});subs=keep}
function suscribir(){
  const err=e=>{console.warn(e);toast(errTxt(e))};
  primeraCarga=true;
  subs.push(db.collection('registros').onSnapshot(s=>{
    REG=s.docs.map(d=>Object.assign({},d.data({serverTimestamps:'estimate'}),{id:d.id}));
    if(!primeraCarga&&insiste()){const nuevas=s.docChanges().filter(c=>c.type==='added'&&!c.doc.metadata.hasPendingWrites).map(c=>c.doc.data({serverTimestamps:'estimate'})).filter(fallaPendiente).filter(deMiLinea);if(nuevas.length)nuevaFalla(nuevas[0])}
    const eraPrimera=primeraCarga;primeraCarga=false;pintarBanner();render();if(escaneoPendiente){const em=escaneoPendiente;escaneoPendiente=null;setTimeout(()=>procesarEscaneo(em),0)}if(insiste()&&misPendientes().length&&(eraPrimera||abrirAlarma._i))abrirAlarma();else if(abrirAlarma._i&&!misPendientes().length)cerrarAlarma()},err));
  subs.push(db.collection('maquinas').onSnapshot(s=>{MAQCFG={};s.docs.forEach(d=>MAQCFG[d.id]=d.data());render()},err));
  subs.push(db.collection('programa').onSnapshot(s=>{PROG=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));render()},err));
  if(esSupervisor())subs.push(db.collection('usuarios').onSnapshot(s=>{USUARIOS=s.docs.map(d=>Object.assign({},d.data(),{uid:d.id}));render()},err));
}
function entrar(){
  pintarSesion();
  if(atiende()&&estadoPush()==='pendiente'&&pushSoportado()&&Notification.permission==='granted')activarPush(true);
  let v=inicioRol();
  if(destino&&destino.vista==='qr'&&insiste()){const d=destino;destino=null;maqSel=d.maq;escaneoPendiente=d.maq;ir('alertas');return}
  if(destino&&destino.vista==='qr'){const d=destino;destino=null;maqSel=d.maq;
    if(vistasPermitidas().includes('falla')){maqForm=d.maq;maqFija=d.maq;ir('falla',true);return}
    ir('ficha');return}
  if(destino){if(destino.maq)maqSel=destino.maq;if(vistasPermitidas().includes(destino.vista))v=destino.vista;else if(destino.vista&&destino.vista!=='ficha')toast('No tienes acceso a esa sección.');destino=null}
  ir(v);
}
function pintarSesion(){
  const s=$('sesion');s.hidden=false;
  s.innerHTML=`<div><b>${esc(perfil.nombre)}</b>${esc(rolTxt(perfil.rol))} · ${esc(usuarioDe(usuario.email))}</div><button id="miCuenta">Mi cuenta</button><button id="salir">Cerrar sesión</button>`;
  const n=$('nav');n.hidden=false;n.className=perfil.rol==='Operador'?'grande':'';

// ===== Navegación =====
function ir(v,keep){
  if(!perfil)return;
  if(!vistasPermitidas().includes(v)){if(v)toast('No tienes acceso a esa sección.');v=inicioRol()}
  if(!keep){prefill=null;editId=null;maqForm=null;maqFija=null;finalizando=null}
  vista=v;document.body.classList.toggle('modo-pantalla',v==='pantalla'||(v==='tablero'&&tableroCompleto));
  if(v==='pantalla'||v==='tablero')pedirWakeLock();else soltarWakeLock();
  escribirDireccion();render(true);window.scrollTo({top:0});
}
function formOcupado(){const a=$('app');if(a.dataset.v!==vista)return false;if(a.dataset.sucio==='1')return true;const el=document.activeElement;return !!(el&&a.contains(el)&&el.closest('form'))}
function render(forzar){
  if(!perfil)return;
  if(!vistasPermitidas().includes(vista))vista=inicioRol();
  if(!forzar&&formOcupado()){pendiente=true;return}
  pendiente=false;
  const a=$('app');a.innerHTML=V[vista]();a.dataset.v=vista;a.dataset.sucio='';
  marcarNav();enlazar();pintarBanner();
  if(vista==='ficha'&&esSupervisor())pintarQR(maqSel,'qrbox');
}
document.addEventListener('input',e=>{if(e.target.closest('#app form'))$('app').dataset.sucio='1'});

// ===== Alertas en tiempo real =====
function desbloquearAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C()}if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.05);sonidoOn=true}catch(e){}}
function sirena(){if(!sonidoOn||!audioCtx||Date.now()<silencioHasta)return;ultimoSonido=Date.now();
  try{if(audioCtx.state==='suspended')audioCtx.resume();const t0=audioCtx.currentTime;
    for(let i=0;i<6;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i%2?660:990;g.gain.setValueAtTime(0.0001,t0+i*0.32);g.gain.exponentialRampToValueAtTime(0.25,t0+i*0.32+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.32+0.28);o.connect(g);g.connect(audioCtx.destination);o.start(t0+i*0.32);o.stop(t0+i*0.32+0.3)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}}
function misPendientes(){return REG.filter(fallaPendiente).filter(deMiLinea).sort((a,c)=>msCreado(a)-msCreado(c))}
function abrirAlarma(){if(!perfil||!insiste())return;const pend=misPendientes();if(!pend.length)return cerrarAlarma();
  const r=pend[0],m=maq(r.equipo),a=$('alarma');
  a.innerHTML=`<div class="caja"><h2>🚨 FALLA</h2><div class="zona">${esc(m?(m.planta?m.planta+' · ':'')+m.zona:r.equipo)}</div><p><b>${esc(r.tipoFalla||'Falla')}</b>${r.severidad==='Paro de línea'?' · LÍNEA DETENIDA':''}</p><p>${esc(r.actividad||'')}</p><p>Reportó ${esc(r.tecnico||'')}${pend.length>1?' · '+pend.length+' fallas sin atender':''}</p>${sonidoOn?'':'<p><b>Toca la pantalla para activar el sonido</b></p>'}<div class="instruccion">Para atenderla y apagar la alarma, escanea el código QR de la máquina.</div><button class="atender" id="abrirEscaner">📷 Escanear QR de la máquina</button></div>`;
  a.hidden=false;sirena();
  if(!abrirAlarma._i)abrirAlarma._i=setInterval(()=>{if(!misPendientes().length)return cerrarAlarma();sirenaForzada()},3000)}
function sirenaForzada(){const s0=silencioHasta;silencioHasta=0;sirena();silencioHasta=s0}
async function procesarEscaneo(id){const m=maq(id);if(!m){toast('Ese código no corresponde a ninguna máquina registrada.');return}
  maqSel=id;const pend=REG.filter(r=>r.equipo===id&&fallaPendiente(r)).sort((a,b)=>msCreado(a)-msCreado(b));
  if(pend.length){const r=pend[0],ref=db.collection('registros').doc(r.id);
    try{await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists||!PENDIENTES.includes(s.data().estado))throw {code:'tomada'};tx.update(ref,{estado:'En atención',atendidoUid:usuario.uid,atendidoPor:perfil.nombre,inicioAtencion:TS()})});
      toast('✅ Falla de '+m.zona+' tomada a tu nombre. Hora de inicio registrada.');if(!misPendientes().length)cerrarAlarma();else abrirAlarma();ir('alertas')}
    catch(e){toast(errTxt(e.code==='permission-denied'?{code:'tomada'}:e));ir('alertas')}
    return}
  const mia=REG.find(r=>r.equipo===id&&fallaEnAtencion(r)&&r.atendidoUid===usuario.uid);
  if(mia){toast('Ya estás atendiendo la falla de '+m.zona+'. Finalízala cuando termines.');ir('alertas');return}
  toast('No hay fallas pendientes en '+m.zona+'.');maqForm=id;maqFija=id;ir('falla',true)}
let escStream=null,escLoop=null;
function cargarJsQR(){return window.jsQR?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
async function abrirEscaner(){const e=$('escaner');e.hidden=false;
  e.innerHTML='<h2 style="margin:0;color:#fff">📷 Escanea el QR de la máquina</h2><video id="escVideo" playsinline muted autoplay></video><p id="escMsg">Apunta la cámara al código pegado en la máquina.</p><button id="cerrarEscaner">Cancelar</button>';
  try{await cargarJsQR();escStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('escVideo');v.srcObject=escStream;await v.play();const c=document.createElement('canvas'),g=c.getContext('2d',{willReadFrequently:true});
    const paso=()=>{if(!escStream)return;if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;g.drawImage(v,0,0);const d=g.getImageData(0,0,c.width,c.height);const q=window.jsQR(d.data,c.width,c.height,{inversionAttempts:'dontInvert'});
      if(q&&q.data){let id=null;try{const u=new URL(q.data);const mm=maqPorClave(u.searchParams.get('m'))||MAQUINAS.find(x=>x.id===u.searchParams.get('equipo'));id=mm&&mm.id}catch(er){}
        if(id){try{navigator.vibrate&&navigator.vibrate(150)}catch(er){}cerrarEscaner();procesarEscaneo(id);return}
        $('escMsg').textContent='Ese código no es de una máquina del sistema. Intenta con el QR pegado en la máquina.'}}
      escLoop=requestAnimationFrame(paso)};paso()}
  catch(er){$('escMsg').textContent='No se pudo abrir la cámara. Permite el acceso a la cámara para esta página, o escanea el QR con la cámara del teléfono.'}}
function cerrarEscaner(){if(escLoop)cancelAnimationFrame(escLoop);escLoop=null;if(escStream){escStream.getTracks().forEach(t=>t.stop());escStream=null}const e=$('escaner');e.hidden=true;e.innerHTML=''}
function cerrarAlarma(){clearInterval(abrirAlarma._i);abrirAlarma._i=null;const a=$('alarma');if(a){a.hidden=true;a.innerHTML=''}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&misPendientes().length)abrirAlarma()});
function nuevaFalla(r){abrirAlarma();const m=maq(r.equipo);toast('🚨 Nueva falla en '+(m?m.zona:r.equipo)+': '+(r.tipoFalla||'')) ;parpadearTitulo()}
function parpadearTitulo(){if(parpadearTitulo._i)return;let on=false;const orig='Mantenimiento La Josefina DPC';parpadearTitulo._i=setInterval(()=>{const n=REG.filter(fallaPendiente).length;if(!n){clearInterval(parpadearTitulo._i);parpadearTitulo._i=null;document.title=orig;return}on=!on;document.title=on?'🚨 ('+n+') FALLA PENDIENTE':orig},1000)}
function pintarBanner(){const b=$('banner');if(!b)return;
  if(!perfil||!atiende()||vista==='pantalla'){b.innerHTML='';return}
  const pend=REG.filter(fallaPendiente).filter(deMiLinea).sort((a,c)=>msCreado(a)-msCreado(c));
  let h='';
  const ep=estadoPush();
  if(ep==='pendiente'&&insiste())h+=`<div class="activar"><span>📲 Recibe las fallas aunque el teléfono esté bloqueado.</span><button class="mini" id="activarPush">Activar notificaciones</button></div>`;
  if(ep==='ios-instalar')h+=`<div class="activar"><span>📲 Para recibir fallas con el iPhone bloqueado: toca Compartir → «Agregar a inicio» y abre la app desde ese ícono.</span></div>`;
  if(!sonidoOn)h+=`<div class="activar"><span>🔔 Toca para recibir el sonido de las alertas en este dispositivo.</span><button class="mini" id="activarAlertas">Activar alertas</button></div>`;
  if(pend.length){const p=pend[0],m=maq(p.equipo);
    h+=`<div class="alerta pulso"><div><b>🚨 ${pend.length} falla${pend.length>1?'s':''} sin atender</b><br>${esc(m?m.zona:'')} · ${esc(p.tipoFalla||'Falla')} · <span class="reloj" data-desde="${msCreado(p)}"></span></div>
    <div class="acciones" style="margin:0">${vista!=='alertas'?'<button class="mini" data-v2="alertas">Ver fallas</button>':''}${insiste()?'<button class="mini" id="abrirEscaner">📷 Escanear QR</button>':`<button class="mini sec" id="silenciar">${Date.now()<silencioHasta?'Silenciado':'Silenciar 5 min'}</button>`}</div></div>`}
  b.innerHTML=h;actualizarRelojes()}
function actualizarRelojes(){const now=Date.now();document.querySelectorAll('[data-desde]').forEach(e=>{const d=Number(e.dataset.desde);e.textContent=d?'hace '+dur(now-d):''});const hr=$('horaTablero');if(hr)hr.textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
setInterval(()=>{actualizarRelojes();if(atiende()&&REG.some(r=>fallaPendiente(r)&&deMiLinea(r))&&Date.now()-ultimoSonido>45000)sirena()},1000);
async function pedirWakeLock(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function soltarWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(vista==='pantalla'||vista==='tablero'))pedirWakeLock()});

// ===== Datos derivados =====
function registros(id){return deMaq(REG,id||'todas').filter(r=>maq(r.equipo)).slice().sort(ordenar)}
function programa(id){return deMaq(PROG,id||'todas').slice().sort((a,b)=>a.fecha.localeCompare(b.fecha))}
function estadoMaq(id){
  const ab=registros(id).filter(abierto);
  if(ab.some(r=>esFalla(r)&&r.severidad==='Paro de línea'))return {txt:'Detenida',cls:'bad',det:'Falla abierta con paro de línea'};
  if(ab.some(fallaEnAtencion))return {txt:'En reparación',cls:'warn',det:'Un mecánico está atendiendo una falla'};
  if(ab.some(esFalla))return {txt:'Operando con falla reportada',cls:'warn',det:'Hay fallas sin atender'};
  if(ab.some(r=>EN_ATENCION.includes(r.estado)))return {txt:'En mantenimiento',cls:'warn',det:'Trabajo en proceso'};
  return {txt:'Operando',cls:'',det:'Sin fallas abiertas'};
}
function proximo(id){
  const hs=hoy(),prog=programa(id).filter(p=>p.estado!=='Realizado');
  const venc=prog.filter(p=>p.fecha<hs);if(venc.length)return {fecha:venc[0].fecha,txt:venc[0].actividad,vencido:true};
  const fut=prog.find(p=>p.fecha>=hs);if(fut)return {fecha:fut.fecha,txt:fut.actividad};
  const f=Number((MAQCFG[id]||{}).frecuenciaDias);const ult=registros(id).find(r=>r.tipo==='Preventivo'&&r.estado==='Completado');
  if(f>0&&ult){const fe=sumarDias(ult.fecha,f);return {fecha:fe,txt:'Preventivo según frecuencia ('+f+' días)',vencido:fe<hs}}
  return null;
}
function tiempos(r){const c=msCreado(r),i=ms(r.inicioAtencion),f=ms(r.finAtencion);return {resp:i&&c?i-c:null,rep:f&&i?f-i:null,total:f&&c?f-c:null}}

// ===== Componentes =====
function fotosBtn(ids,txt){return ids&&ids.length?`<button class="mini sec" data-fotos="${esc(ids.join(','))}">📷 ${txt||'Ver fotos'} (${ids.length})</button>`:''}
function detalleFalla(r){if(!esFalla(r))return '';const t=tiempos(r);let h='';
  if(r.atendidoPor)h+=`<br><small class="muted">Atendió: ${esc(r.atendidoPor)}${ms(r.inicioAtencion)?' · inicio '+hhmm(ms(r.inicioAtencion)):''}${ms(r.finAtencion)?' · fin '+hhmm(ms(r.finAtencion)):''}</small>`;
  if(t.resp!=null||t.rep!=null)h+=`<br><small class="muted">Respuesta: ${durMin(t.resp)} · Reparación: ${durMin(t.rep)} · Total: ${durMin(t.total)}</small>`;
  if(r.trabajoRealizado)h+=`<br><small><b>Trabajo realizado:</b> ${esc(r.trabajoRealizado)}</small>`;
  if(r.ajustes)h+=`<br><small><b>Ajustes:</b> ${esc(r.ajustes)}</small>`;
  return h}
function filas(arr,opc={}){
  const acc=opc.acciones&&esAdmin();
  if(!arr.length)return `<p class="muted">${opc.vacio||'No hay registros.'}</p>`;
  return `<div class="scroll"><table><thead><tr><th>Fecha</th>${opc.sinMaq?'':'<th>Máquina</th>'}<th>Tipo</th><th>Actividad / falla</th><th>Responsable</th><th>Duración</th><th>Estado</th>${acc?'<th></th>':''}</tr></thead><tbody>${arr.map(r=>{const fotos=[...(r.fotos||[]),...(r.fotosCierre||[])];return `<tr>
  <td class="num">${fmt(r.fecha)}${r.hora?`<br><small class="muted">${esc(r.hora)}</small>`:''}</td>
  ${opc.sinMaq?'':`<td>${tagMaq(r.equipo)}</td>`}
  <td>${tagTipo(r.tipo)}${r.tipoFalla?`<br><small class="muted">${esc(r.tipoFalla)}</small>`:''}${r.severidad==='Paro de línea'?`<br><small class="muted">Paro de línea</small>`:''}</td>
  <td>${esc(r.actividad)}${r.refacciones?`<br><small class="muted">Refacciones: ${esc(r.refacciones)}</small>`:''}${r.observaciones?`<br><small class="muted">Obs.: ${esc(r.observaciones)}</small>`:''}${r.paro?`<br><small class="muted">Paro de línea: ${esc(r.paro)} min</small>`:''}${detalleFalla(r)}${fotos.length?'<br>'+fotosBtn(fotos):''}</td>
  <td>${esc(r.tecnico)}${r.rol?`<br><small class="muted">${esc(r.rol)}</small>`:''}</td>
  <td class="num">${r.minutos?esc(r.minutos)+' min':'—'}</td>
  <td>${tagEstado(r.estado)}${r.fechaCierre?`<br><small class="muted">Cierre: ${fmt(r.fechaCierre)}</small>`:''}</td>
  ${acc?`<td><div class="acciones" style="margin:0">${abierto(r)?`<button class="mini" data-cerrar="${esc(r.id)}">${esFalla(r)?'Cerrar falla':'Completar'}</button>`:''}<button class="mini sec" data-editar="${esc(r.id)}">Editar</button><button class="mini peligro" data-borrar="${esc(r.id)}">Eliminar</button></div></td>`:''}
  </tr>`}).join('')}</tbody></table></div>`;
}
function kpi(n,t){return `<div class="card kpi"><h2>${n}</h2><span>${t}</span></div>`}
function selMaq(actual,attr,conTodas){return `<div class="selmaq">${conTodas?`<button data-${attr}="todas" aria-pressed="${actual==='todas'}">Ambas líneas</button>`:''}${MAQUINAS.map(m=>`<button data-${attr}="${m.id}" aria-pressed="${actual===m.id}">${esc(m.zona)}</button>`).join('')}</div>`}
function opcionesMaq(sel,vacio){return (vacio&&!sel?'<option value="" selected disabled>Selecciona la máquina…</option>':'')+MAQUINAS.map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.nombre)} · ${esc(m.planta)} · ${esc(m.zona)}</option>`).join('')}
function tarjetaFalla(r,opc={}){const m=maq(r.equipo),en=fallaEnAtencion(r),mia=en&&r.atendidoUid===usuario.uid;
  return `<div class="fcard ${en?'atencion':''}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(m?m.nombre+' · '+m.zona:r.equipo)}</h3><span class="reloj" data-desde="${en?ms(r.inicioAtencion)||msCreado(r):msCreado(r)}"></span></div>
  <p style="margin:0 0 6px"><b>${esc(r.tipoFalla||'Falla')}</b>${r.severidad==='Paro de línea'?' <span class="tag bad">Línea detenida</span>':''} ${tagEstado(r.estado)}</p>
  <p style="margin:0 0 6px">${esc(r.actividad)}</p>
  <small class="muted">Reportó ${esc(r.tecnico)} a las ${hhmm(msCreado(r))||esc(r.hora)}${en?` · Atiende <b>${esc(r.atendidoPor||'')}</b> desde ${hhmm(ms(r.inicioAtencion))}`:''}</small>
  ${r.fotos&&r.fotos.length?'<div class="acciones" style="margin-top:8px">'+fotosBtn(r.fotos)+'</div>':''}
  ${opc.acciones&&atiende()?(PENDIENTES.includes(r.estado)?(insiste()?`<div class="acciones"><button class="falla xl" id="abrirEscaner">📷 Escanear QR para atender</button></div><small class="muted">La falla se toma a tu nombre al escanear el código de la máquina.</small>`:`<div class="acciones"><button class="falla xl" data-atender="${esc(r.id)}">Atender falla</button></div>`):mia&&finalizando!==r.id?`<div class="acciones"><button class="xl" data-finalizar="${esc(r.id)}">Finalizar trabajo</button></div>`:''):''}
  ${mia&&finalizando===r.id?formFinalizar(r):''}</div>`}
function formFinalizar(r){return `<form id="fFinalizar" data-id="${esc(r.id)}" style="margin-top:10px"><label for="z_trab">Trabajo realizado</label><textarea id="z_trab" required maxlength="2000"></textarea>
  <label for="z_aj">Ajustes efectuados</label><textarea id="z_aj" maxlength="2000" style="min-height:70px"></textarea>
  <label for="z_ref">Refacciones utilizadas (si aplica)</label><input id="z_ref" maxlength="250">
  <label for="z_fotos">Fotografías (opcional, hasta 3)</label><input id="z_fotos" type="file" accept="image/*" multiple>
  <div class="acciones"><button type="submit" class="xl">Guardar y finalizar</button><button type="button" class="sec" id="cancelFin">Cancelar</button></div><div id="zErr"></div></form>`}

V.alertas=()=>{const pend=REG.filter(fallaPendiente).sort((a,b)=>msCreado(a)-msCreado(b)),aten=REG.filter(fallaEnAtencion).sort((a,b)=>msCreado(a)-msCreado(b));
  const mias=aten.filter(r=>r.atendidoUid===usuario.uid),otras=aten.filter(r=>r.atendidoUid!==usuario.uid);
  const hoyCerr=REG.filter(r=>esFalla(r)&&r.estado==='Cerrada'&&r.fechaCierre===hoy()).sort((a,b)=>(ms(b.finAtencion)||0)-(ms(a.finAtencion)||0));

  <h2>Fallas sin atender (${pend.length})</h2>${pend.length?pend.map(r=>tarjetaFalla(r,{acciones:true})).join(''):'<div class="card"><p class="muted" style="margin:0">No hay fallas pendientes. Cuando una operadora reporte una, aparecerá aquí al instante con alerta y sonido.</p></div>'}
  ${otras.length?`<h2>En atención por otros mecánicos</h2>${otras.map(r=>tarjetaFalla(r)).join('')}`:''}
  <div class="card"><h2>Atendidas hoy (${hoyCerr.length})</h2>${hoyCerr.length?hoyCerr.map(r=>{const t=tiempos(r);return `<div class="item"><div>${tagMaq(r.equipo)} <b>${esc(r.tipoFalla||'Falla')}</b><br><small class="muted">${esc(r.atendidoPor||r.cerradoPor||'')} · respuesta ${durMin(t.resp)} · reparación ${durMin(t.rep)}</small></div>${tagEstado(r.estado)}</div>`}).join(''):'<p class="muted">Ninguna todavía.</p>'}</div>`};
function estadoTile(id){const ab=REG.filter(r=>r.equipo===id&&esFalla(r)&&abierto(r)).sort((a,b)=>msCreado(a)-msCreado(b));
  const pend=ab.filter(fallaPendiente),aten=ab.filter(fallaEnAtencion);
  if(pend.length){const r=pend[0];return {cls:'rojo',txt:r.severidad==='Paro de línea'?'PARADA':'FALLA REPORTADA',det:esc(r.tipoFalla||'Falla')+' · esperando mecánico',desde:msCreado(r),n:ab.length}}
  if(aten.length){const r=aten[0];return {cls:'amarillo',txt:'EN ATENCIÓN',det:esc(r.tipoFalla||'Falla')+' · '+esc(r.atendidoPor||'Mecánico'),desde:ms(r.inicioAtencion)||msCreado(r),n:ab.length}}

function leerImagen(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No se pudo leer la foto'))};img.src=url})}
async function comprimir(file){const img=await leerImagen(file);let max=1280,q=0.7,data='';
  for(let i=0;i<6;i++){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/jpeg',q);if(data.length<600000)break;max=Math.round(max*0.8);q=Math.max(0.45,q-0.08)}
  return data}
async function subirFotos(input,registroId){const files=[...(input&&input.files||[])].slice(0,3);const ids=[];
  for(const f of files){const data=await comprimir(f);const ref=db.collection('fotos').doc();await ref.set({registro:registroId,data,creadoUid:usuario.uid,creadoPor:perfil.nombre,creadoEn:TS()});ids.push(ref.id)}
  return ids}

async function guardarUsuario(ev){ev.preventDefault();const f=ev.target,b=f.querySelector('button[type=submit]');b.disabled=true;$('uErr').innerHTML='';
  const uid=f.dataset.uid,num=$('u_num').value.trim();
  const datos={nombre:$('u_nom').value.trim(),numEmpleado:num,rol:$('u_rol').value,planta:$('u_planta').value,linea:$('u_linea').value,activo:$('u_act').value==='1'};
  if(num&&!/^[0-9]{1,10}$/.test(num)){$('uErr').innerHTML='<p class="error">El número de empleado solo puede tener dígitos.</p>';b.disabled=false;return}
  try{
    if(uid){await db.collection('usuarios').doc(uid).update(Object.assign(datos,{modificadoPor:usuario.uid,modificadoEn:TS()}));usrEdit=null;toast('Datos de '+datos.nombre+' actualizados.');render(true);return}
    const u=$('u_user').value.trim().toLowerCase();
    if(!/^[a-z0-9._-]{2,40}$/.test(u)){$('uErr').innerHTML='<p class="error">El usuario debe tener de 2 a 40 caracteres: letras sin acento, números, punto, guion o guion bajo. Sin espacios.</p>';b.disabled=false;return}
    if(SERVIDOR_LISTO){await llamar('crearUsuario',Object.assign({},datos,{usuario:u,contrasena:$('u_pass').value}))}
    else{const sec=fb.apps.find(a=>a.name==='altas')||fb.initializeApp(FIREBASE_CONFIG,'altas');
    const c=await sec.auth().createUserWithEmailAndPassword(correoDe(u),$('u_pass').value);const nuid=c.user.uid;await sec.auth().signOut();
    await db.collection('usuarios').doc(nuid).set(Object.assign(datos,{usuario:u,creadoPor:usuario.uid,creadoEn:TS()}));}
    usrAlta=false;toast('Usuario «'+u+'» creado para '+datos.nombre+'.');render(true)
  }catch(e){$('uErr').innerHTML=`<p class="error">${esc(errTxt(e))}</p>`;b.disabled=false}}
async function atender(id,btn){btn.disabled=true;btn.textContent='Asignando…';const ref=db.collection('registros').doc(id);
  try{await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists)throw {code:'tomada'};const d=s.data();if(!PENDIENTES.includes(d.estado))throw {code:'tomada'};
      tx.update(ref,{estado:'En atención',atendidoUid:usuario.uid,atendidoPor:perfil.nombre,inicioAtencion:TS()})});
    toast('Falla asignada a ti. Hora de inicio registrada.');if(vista!=='alertas'&&vista!=='pantalla')ir('alertas')}
  catch(e){toast(errTxt(e.code==='permission-denied'?{code:'tomada'}:e));btn.disabled=false;btn.textContent='Atender falla'}}

  if(b.dataset.editar){editId=b.dataset.editar;prefill=null;vista='registrar';escribirDireccion();render(true);window.scrollTo({top:0});return}
  if(b.dataset.borrar||b.dataset.borrarprog){
    if(b.dataset.ok!=='1'){b.dataset.ok='1';const t=b.textContent;b.textContent='¿Confirmar?';setTimeout(()=>{if(b.isConnected){b.dataset.ok='';b.textContent=t}},4000);return}
    try{if(b.dataset.borrar){await db.collection('registros').doc(b.dataset.borrar).delete();toast('Registro eliminado.')}else{await db.collection('programa').doc(b.dataset.borrarprog).delete();toast('Programa eliminado.')}}catch(er){toast(errTxt(er))}return}
  if(b.dataset.realizar){const p=PROG.find(x=>x.id===b.dataset.realizar);if(!p)return;prefill={progId:p.id,equipo:p.equipo,fecha:p.fecha<=hoy()?hoy():p.fecha,actividad:p.actividad,tecnico:p.responsable||perfil.nombre,tipo:'Preventivo'};ir('registrar',true);return}

  if(b.dataset.activo){const u=USUARIOS.find(x=>x.uid===b.dataset.activo);if(!u)return;try{await db.collection('usuarios').doc(u.uid).update({activo:!u.activo});toast(u.activo?'Cuenta desactivada.':'Cuenta activada.')}catch(er){toast(errTxt(er))}return}
});

function exportar(){const keys=['fecha','hora','equipo','linea','tipo','tipoFalla','severidad','actividad','tecnico','rol','atendidoPor','inicio','fin','respuesta_min','reparacion_min','trabajoRealizado','ajustes','refacciones','minutos','estado','fechaCierre','observaciones'];
  const val=(r,k)=>{const t=tiempos(r);if(k==='linea')return (maq(r.equipo)||{}).zona;if(k==='inicio')return hhmm(ms(r.inicioAtencion));if(k==='fin')return hhmm(ms(r.finAtencion));if(k==='respuesta_min')return t.resp!=null?Math.round(t.resp/60000):'';if(k==='reparacion_min')return t.rep!=null?Math.round(t.rep/60000):'';return r[k]||''};
  const csv='﻿'+[keys,...filtrar().map(r=>keys.map(k=>val(r,k)))].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='mantenimiento_la_josefina_dpc_'+hoy()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Enlace copiado.')}catch(e){const u=$('qrurl');if(u){const r=document.createRange();r.selectNodeContents(u);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selecciona y copia el enlace.')}}

// ===== QR =====
function urlQR(id){return URL_BASE+'?m='+maq(id).clave}
function pintarQR(id,boxId,size){const box=$(boxId);if(!box)return;box.innerHTML='';
  if(typeof QRCode==='undefined'){box.innerHTML='<small class="muted">No se pudo cargar el generador de QR.</small>';return}
  new QRCode(box,{text:urlQR(id),width:size||180,height:size||180,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function qrDataURL(id){const tmp=document.createElement('div');tmp.id='qrtmp';tmp.style.position='absolute';tmp.style.left='-9999px';document.body.appendChild(tmp);pintarQR(id,'qrtmp',512);
  const c=tmp.querySelector('canvas');const m=maq(id);const out=document.createElement('canvas');out.width=640;out.height=760;const g=out.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,640,760);g.imageSmoothingEnabled=false;if(c)g.drawImage(c,64,64,512,512);
  g.fillStyle='#173f80';g.font='bold 34px -apple-system,Arial';g.textAlign='center';g.fillText(m.nombre+' · '+m.zona,320,630);
  g.fillStyle='#1c2833';g.font='26px -apple-system,Arial';g.fillText('La Josefina DPC · Planta '+m.planta+' · '+m.id,320,675);g.font='22px -apple-system,Arial';g.fillText('Escanea para reportar una falla en esta máquina',320,715);
  tmp.remove();return out.toDataURL('image/png')}
function bajarQR(id){const a=document.createElement('a');a.href=qrDataURL(id);a.download='QR_La_Josefina_'+maq(id).zona.replace(' ','_')+'.png';document.body.appendChild(a);a.click();a.remove()}
function imprimirQR(){const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir.');return}
  w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Códigos QR · La Josefina DPC</title><style>body{font-family:-apple-system,Arial;margin:0;padding:20px;text-align:center}img{width:300px;max-width:90%;margin:10px;border:1px dashed #999}@media print{img{page-break-inside:avoid}}</style></head><body>'+MAQUINAS.map(m=>'<img src="'+qrDataURL(m.id)+'" alt="QR '+m.zona+'">').join('')+'<script>setTimeout(function(){window.print()},400)<\/script></body></html>');w.document.close()}
