<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantenimiento DPC">
<meta name="theme-color" content="#8f1734">
<title>Mantenimiento La Josefina DPC</title>
<style>
/* Layout: banda guinda de encabezado + columna central de tarjetas */
:root{
  --bg:#f3f5f8;--card:#ffffff;--fg:#1c2833;--muted:#67717d;--line:#e9edf1;--input:#cfd4da;--th:#f6f7f9;
  --accent:#8f1734;--accent-ink:#ffffff;--accent-soft:#f7e9ed;--accent-line:#e3d1d7;--header:#8f1734;
  --ok:#276642;--ok-bg:#e9f5ee;--warn:#805700;--warn-bg:#fff2db;--bad:#a3262a;--bad-bg:#fde8e8;--plan:#2d4f8f;--plan-bg:#e8eefb;
  --la:#2d4f8f;--la-bg:#e8eefb;--lb:#6a3d8f;--lb-bg:#f1e8fb;
  --shadow:0 2px 12px #1d24300d;
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141619;--card:#1e2126;--fg:#e8eaed;--muted:#9aa3ad;--line:#2d3138;--input:#3a3f47;--th:#24282e;
  --accent:#c2405f;--accent-ink:#ffffff;--accent-soft:#3a1f27;--accent-line:#5a2e3a;--header:#6e1028;
  --ok:#7fd3a1;--ok-bg:#1d3327;--warn:#f0c46b;--warn-bg:#3a2f17;--bad:#f29494;--bad-bg:#3d1f21;--plan:#9db8f0;--plan-bg:#1f2a40;
  --la:#9db8f0;--la-bg:#1f2a40;--lb:#cfa8f0;--lb-bg:#2e2140;
  --shadow:0 2px 12px #0006;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--header);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hin{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:24px;text-wrap:balance}
header small{opacity:.85}
.sesion{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.sesion b{display:block;font-size:14px}
.sesion button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;padding:7px 11px;font-size:13px}
.wrap{max-width:1050px;margin:auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
button,.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-block}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px}
button.sec,.btn.sec{background:var(--card);color:var(--accent);border:1px solid var(--accent-line)}
button.mini{padding:6px 10px;font-size:13px;border-radius:7px}
button.peligro{background:var(--bad-bg);color:var(--bad);border:1px solid transparent}
button.falla{background:var(--bad);color:#fff}
nav button{background:var(--card);color:var(--accent);border:1px solid var(--accent-line);padding:9px 13px}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:16px}
.grid .card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.kpi h2{font-size:30px;margin:0 0 2px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted)}
.muted{color:var(--muted)}
.tag{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.plan{background:var(--plan-bg);color:var(--plan)}
.tag.neu{background:var(--th);color:var(--muted)}
.tag.la{background:var(--la-bg);color:var(--la)}
.tag.lb{background:var(--lb-bg);color:var(--lb)}
.warning{background:var(--warn-bg);padding:12px;border-radius:9px;color:var(--warn);margin-bottom:14px}
.aviso{background:var(--plan-bg);padding:12px;border-radius:9px;color:var(--plan);margin-bottom:14px}
.error{background:var(--bad-bg);padding:12px;border-radius:9px;color:var(--bad);margin-top:12px}
label{display:block;font-weight:600;margin-top:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--input);border-radius:8px;font:inherit;font-size:16px;margin-top:5px;background:var(--card);color:var(--fg)}
input:disabled{opacity:.75}
textarea{min-height:90px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;margin-bottom:8px}
@media(max-width:480px){.dos{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);text-align:left;padding:10px;vertical-align:top}
th{background:var(--th);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
a{color:var(--accent)}
footer{text-align:center;color:var(--muted);padding:30px 16px}
h2{margin-top:0;text-wrap:balance}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.selmaq{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.selmaq button{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.selmaq button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.login{max-width:420px;margin:30px auto}
/* Calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding:4px 0}
.cal button.dia{background:var(--th);color:var(--fg);border:1px solid transparent;border-radius:8px;min-height:54px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
.cal button.dia.fuera{opacity:.35}
.cal button.dia.hoy{border-color:var(--accent)}
.cal button.dia.sel{background:var(--accent-soft);border-color:var(--accent)}
.marcas{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.m{width:7px;height:7px;border-radius:50%;display:inline-block}
.m.ok{background:var(--ok)}.m.bad{background:var(--bad)}.m.plan{background:var(--plan)}.m.warn{background:var(--warn)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.barra{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.barra .pista{background:var(--th);border-radius:5px;height:14px;overflow:hidden}
.barra .relleno{background:var(--accent);height:100%;border-radius:5px}
.barra b{font-variant-numeric:tabular-nums;text-align:right}
.qr{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.qrbox{background:#fff;padding:10px;border-radius:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.qrbox img,.qrbox canvas{max-width:100%}
.url{font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;background:var(--th);padding:8px 10px;border-radius:8px;-webkit-user-select:all;user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px #0004;z-index:20;max-width:calc(100% - 32px)}
@media(max-width:550px){header h1{font-size:21px}.card{padding:16px}.kpi h2{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="hin"><div><h1>🔧 Mantenimiento La Josefina DPC</h1><small>La Josefina DPC · Envasadoras verticales · Planta AM Pack</small></div><div class="sesion" id="sesion" hidden></div></div></header>
<div class="wrap">
  <nav id="nav" hidden></nav>
  <main id="app"><div class="card"><p class="muted">Cargando…</p></div></main>
</div>
<footer>Mantenimiento La Josefina DPC · Sistema digital de mantenimiento · 2026</footer>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== Configuración =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyALzmDOa8K-xfFGbay8tpVCbhIdq6NaMTc",
  authDomain: "mantenimiento-la-josefina.firebaseapp.com",
  projectId: "mantenimiento-la-josefina",
  storageBucket: "mantenimiento-la-josefina.firebasestorage.app",
  messagingSenderId: "1024154810561",
  appId: "1:1024154810561:web:2273253427bfc622613c40"
};
const URL_BASE = 'https://mantenimiento-la-josefina.github.io/';
const DOMINIO = 'lajosefina-dpc.app'; // se entra con número de empleado; internamente es numero@DOMINIO
const USUARIO_INICIAL = '1000';
const MAQUINAS = [
  {id:'AMP-LA-001',clave:'A',nombre:'Envasadora vertical',planta:'AM Pack',zona:'Línea A'},
  {id:'AMP-LB-001',clave:'B',nombre:'Envasadora vertical',planta:'AM Pack',zona:'Línea B'}
];
const ROLES = ['Dirección','Gerencia','Mecánico','Operador'];
const ROLES_ADMIN = ['Dirección','Gerencia'];
const CERRADOS = ['Completado','Cerrada'];
const TIPOS = ['Preventivo','Correctivo','Inspección','Lubricación','Limpieza'];
const VISTAS_ADMIN = ['panel','maquinas','ficha','registrar','falla','trabajos','abiertos','calendario','indicadores','usuarios','cuenta'];
const VISTAS_CAMPO = ['maquinas','ficha','registrar','falla','historial','cuenta'];
const NAV = {
  admin:[['panel','Panel principal'],['maquinas','Máquinas'],['registrar','Registrar trabajo'],['falla','Reportar falla'],['trabajos','Trabajos registrados'],['abiertos','Trabajos abiertos'],['calendario','Calendario'],['indicadores','Indicadores'],['usuarios','Usuarios']],
  campo:[['maquinas','Máquinas'],['registrar','Registrar trabajo'],['falla','Reportar falla'],['historial','Historial']]
};

// ===== Estado =====
let auth=null, db=null, fb=null;
let usuario=null, perfil=null, subs=[];
let REG=[], PROG=[], MAQCFG={}, USUARIOS=[];
let vista='', destino=null, maqSel=MAQUINAS[0].id, prefill=null, editId=null;
let calMes=null, diaSel=null, calMaq='todas', indMaq='todas', histTipo='Todos';
let filtro={maq:'todas',estado:'todos',tipo:'Todos',desde:'',hasta:''};
let pendiente=false, maqForm=null;

// ===== Utilidades =====
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hoy(){return iso(new Date())}
function horaAhora(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function aFecha(s){return new Date(s+'T12:00:00')}
function fmt(s){if(!s)return '—';const d=aFecha(s);return isNaN(d)?esc(s):d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function sumarDias(s,n){const d=aFecha(s);d.setDate(d.getDate()+Number(n));return iso(d)}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,3000)}
function maq(id){return MAQUINAS.find(m=>m.id===id)}
function maqPorClave(c){return MAQUINAS.find(m=>m.clave===String(c||'').toUpperCase())}
function tagMaq(id){const m=maq(id);if(!m)return `<span class="tag neu">${esc(id)}</span>`;return `<span class="tag ${m.clave==='A'?'la':'lb'}">${esc(m.zona)}</span>`}
function tagEstado(e){if(CERRADOS.includes(e))return `<span class="tag">${esc(e)}</span>`;if(e==='En proceso')return `<span class="tag warn">${esc(e)}</span>`;return `<span class="tag bad">${esc(e||'Pendiente')}</span>`}
function tagTipo(t){if(t==='Reporte de falla')return `<span class="tag bad">Falla</span>`;if(t==='Correctivo')return `<span class="tag warn">Correctivo</span>`;if(t==='Preventivo')return `<span class="tag plan">Preventivo</span>`;return `<span class="tag neu">${esc(t)}</span>`}
function esAdmin(){return !!perfil&&perfil.activo===true&&ROLES_ADMIN.includes(perfil.rol)}
function vistasPermitidas(){return esAdmin()?VISTAS_ADMIN:VISTAS_CAMPO}
function inicioRol(){return esAdmin()?'panel':'maquinas'}
function correoDe(u){u=String(u||'').replace(/\s+/g,'').toLowerCase();return u+'@'+DOMINIO}
function usuarioDe(correo){return String(correo||'').replace('@'+DOMINIO,'')}
function msCreado(r){try{if(r.creadoEn&&r.creadoEn.toMillis)return r.creadoEn.toMillis()}catch(e){}return Date.parse(r.creado||'')||0}
function ordenar(a,b){return (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||''))||msCreado(b)-msCreado(a)}
function abierto(r){return !CERRADOS.includes(r.estado)}
function deMaq(arr,id){return id==='todas'?arr:arr.filter(r=>r.equipo===id)}
function errTxt(e){const c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'Número de empleado o contraseña incorrectos.';
  if(c==='auth/too-many-requests')return 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.';
  if(c==='auth/email-already-in-use')return 'Ese número de empleado ya tiene cuenta.';
  if(c==='auth/weak-password')return 'La contraseña debe tener al menos 6 caracteres.';
  if(c==='auth/invalid-email')return 'El número de empleado solo puede tener dígitos.';
  if(c==='auth/network-request-failed'||c==='unavailable')return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  if(c==='permission-denied')return 'No tienes permiso para esta acción.';
  if(c==='auth/requires-recent-login')return 'Por seguridad, cierra sesión, vuelve a entrar y repite el cambio.';
  return 'Ocurrió un error ('+(c||(e&&e.message)||'desconocido')+').'}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ===== Lectura de la dirección (QR y enlaces) =====
function leerDireccion(){
  const q=new URLSearchParams(location.search);const h=(location.hash||'').replace('#','');
  const m=maqPorClave(q.get('m'))||MAQUINAS.find(x=>x.id===q.get('equipo'));
  if(m)return {vista:'ficha',maq:m.id};
  if(h==='ficha')return {vista:'ficha',maq:MAQUINAS[0].id}; // QR anterior de la Línea A
  const f=h.match(/^ficha-([ab])$/i);if(f)return {vista:'ficha',maq:maqPorClave(f[1]).id};
  if(h)return {vista:h};
  return null;
}
function escribirDireccion(){
  try{const url=vista==='ficha'?URL_BASE+'?m='+maq(maqSel).clave:URL_BASE+'#'+vista;
    if(location.origin+location.pathname===URL_BASE)history.replaceState(null,'',url);
    else history.replaceState(null,'',vista==='ficha'?'?m='+maq(maqSel).clave:'#'+vista)}catch(e){}
}

// ===== Arranque =====
function iniciar(){
  if(!FIREBASE_CONFIG){$('app').innerHTML='<div class="card"><h2>Falta conectar la base de datos</h2><p class="muted">El sistema todavía no tiene la configuración de Firebase.</p></div>';return}
  if(typeof firebase==='undefined'){$('app').innerHTML='<div class="card"><h2>Sin conexión</h2><p>No se pudo cargar el sistema. Revisa tu internet y recarga la página.</p></div>';return}
  fb=firebase;
  const app=fb.apps.length?fb.app():fb.initializeApp(FIREBASE_CONFIG);
  auth=app.auth();db=app.firestore();
  destino=leerDireccion();
  auth.onAuthStateChanged(u=>{usuario=u;cerrarSubs();perfil=null;REG=[];PROG=[];MAQCFG={};USUARIOS=[];
    if(!u){pantallaLogin();return}
    $('app').innerHTML='<div class="card"><p class="muted">Cargando tu cuenta…</p></div>';
    let listo=false,rolAntes=null;
    subs.push(db.collection('usuarios').doc(u.uid).onSnapshot(s=>{
      perfil=s.exists?s.data():null;
      if(!perfil||perfil.activo!==true){cerrarSubs(true);listo=false;pantallaSinAcceso();return}
      if(!listo||rolAntes!==perfil.rol){cerrarSubs(true);listo=true;rolAntes=perfil.rol;suscribir();entrar()}else{pintarSesion();render()}
    },e=>{pantallaSinAcceso(errTxt(e))}));
  });
}
function cerrarSubs(dejarPerfil){const keep=dejarPerfil?subs.slice(0,1):[];subs.slice(keep.length).forEach(f=>{try{f()}catch(e){}});subs=keep}
function suscribir(){
  const err=e=>{console.warn(e);toast(errTxt(e))};
  subs.push(db.collection('registros').onSnapshot(s=>{REG=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));render()},err));
  subs.push(db.collection('maquinas').onSnapshot(s=>{MAQCFG={};s.docs.forEach(d=>MAQCFG[d.id]=d.data());render()},err));
  subs.push(db.collection('programa').onSnapshot(s=>{PROG=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));render()},err));
  if(esAdmin())subs.push(db.collection('usuarios').onSnapshot(s=>{USUARIOS=s.docs.map(d=>Object.assign({},d.data(),{uid:d.id}));render()},err));
}
function entrar(){
  pintarSesion();
  let v=inicioRol();
  if(destino){if(destino.maq)maqSel=destino.maq;if(vistasPermitidas().includes(destino.vista))v=destino.vista;else if(destino.vista)toast('No tienes acceso a esa sección.');destino=null}
  ir(v);
}
function pintarSesion(){
  const s=$('sesion');s.hidden=false;
  s.innerHTML=`<div><b>${esc(perfil.nombre)}</b>${esc(perfil.rol)} · No. ${esc(usuarioDe(usuario.email))}</div><button id="miCuenta">Mi cuenta</button><button id="salir">Cerrar sesión</button>`;
  const n=$('nav');n.hidden=false;
  n.innerHTML=NAV[esAdmin()?'admin':'campo'].map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('');
  marcarNav();
}
function marcarNav(){document.querySelectorAll('#nav button').forEach(b=>{const act=b.dataset.v===vista||(vista==='ficha'&&b.dataset.v==='maquinas');if(act)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}

// ===== Pantallas de acceso =====
function ocultarSesion(){$('sesion').hidden=true;$('nav').hidden=true}
function pantallaLogin(){
  ocultarSesion();
  const m=destino&&destino.maq?maq(destino.maq):null;
  $('app').innerHTML=`<div class="login"><div class="card"><h2>Iniciar sesión</h2>
  ${m?`<p class="aviso">Al entrar verás la ficha de la ${esc(m.nombre)} · ${esc(m.zona)}.</p>`:''}
  <form id="fLogin"><label for="l_user">Número de empleado</label><input id="l_user" name="u" inputmode="numeric" pattern="[0-9]*" autocomplete="username" required>
  <label for="l_pass">Contraseña</label><input id="l_pass" name="p" type="password" autocomplete="current-password" required>
  <div class="acciones"><button type="submit">Entrar</button></div><div id="lErr"></div></form>

// ===== Datos derivados =====
function registros(id){return deMaq(REG,id||'todas').filter(r=>maq(r.equipo)).slice().sort(ordenar)}
function programa(id){return deMaq(PROG,id||'todas').slice().sort((a,b)=>a.fecha.localeCompare(b.fecha))}
function estadoMaq(id){
  const ab=registros(id).filter(abierto);
  if(ab.some(r=>r.tipo==='Reporte de falla'&&r.severidad==='Paro de línea'))return {txt:'Detenida',cls:'bad',det:'Falla abierta con paro de línea'};
  if(ab.some(r=>r.tipo==='Reporte de falla'))return {txt:'Operando con falla reportada',cls:'warn',det:'Hay fallas abiertas'};
  if(ab.some(r=>r.estado==='En proceso'))return {txt:'En mantenimiento',cls:'warn',det:'Trabajo en proceso'};
  return {txt:'Operando',cls:'',det:'Sin fallas abiertas'};
}
function proximo(id){
  const hs=hoy(),prog=programa(id).filter(p=>p.estado!=='Realizado');
  const venc=prog.filter(p=>p.fecha<hs);if(venc.length)return {fecha:venc[0].fecha,txt:venc[0].actividad,vencido:true};
  const fut=prog.find(p=>p.fecha>=hs);if(fut)return {fecha:fut.fecha,txt:fut.actividad};
  const f=Number((MAQCFG[id]||{}).frecuenciaDias);const ult=registros(id).find(r=>r.tipo==='Preventivo'&&r.estado==='Completado');
  if(f>0&&ult){const fe=sumarDias(ult.fecha,f);return {fecha:fe,txt:'Preventivo según frecuencia ('+f+' días)',vencido:fe<hs}}
  return null;
}

  if(!calMes){const d=new Date();calMes=new Date(d.getFullYear(),d.getMonth(),1)}

  const regs=registros(calMaq),prog=programa(calMaq),hs=hoy(),porDia={};
  regs.forEach(r=>{(porDia[r.fecha]=porDia[r.fecha]||[]).push(r.tipo==='Reporte de falla'?'bad':(CERRADOS.includes(r.estado)?'ok':'warn'))});
  prog.forEach(p=>{if(p.estado!=='Realizado')(porDia[p.fecha]=porDia[p.fecha]||[]).push('plan')});
  let celdas='';
  for(let i=0;i<42;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);const s=iso(d);if(i>=35&&d.getMonth()!==mo)break;
    celdas+=`<button class="dia ${d.getMonth()!==mo?'fuera':''} ${s===hs?'hoy':''} ${s===diaSel?'sel':''}" data-dia="${s}" aria-label="${fmt(s)}"><span>${d.getDate()}</span><span class="marcas">${(porDia[s]||[]).slice(0,6).map(c=>`<span class="m ${c}"></span>`).join('')}</span></button>`}
  let titulo=calMes.toLocaleDateString('es-MX',{month:'long',year:'numeric'});titulo=titulo.charAt(0).toUpperCase()+titulo.slice(1);

V.indicadores=()=>{
  const regs=registros(indMaq),n=regs.length,comp=regs.filter(r=>!abierto(r)).length,minutos=regs.reduce((s,r)=>s+(Number(r.minutos)||0),0);
  const fallas=regs.filter(r=>r.tipo==='Reporte de falla'),paro=fallas.reduce((s,r)=>s+(Number(r.paro)||0),0);
  const rep=regs.filter(r=>(r.tipo==='Reporte de falla'||r.tipo==='Correctivo')&&Number(r.minutos)>0);
  const mttr=rep.length?Math.round(rep.reduce((s,r)=>s+Number(r.minutos),0)/rep.length):null;
  let mtbf=null;if(fallas.length>=2){const f=fallas.map(r=>aFecha(r.fecha)).sort((a,b)=>a-b);mtbf=Math.round((f[f.length-1]-f[0])/86400000/(f.length-1))}
  const venc=programa(indMaq).filter(p=>p.fecha<=hoy()),cumpl=venc.length?Math.round(100*venc.filter(p=>p.estado==='Realizado').length/venc.length):null;
  const tipos={};regs.forEach(r=>tipos[r.tipo]=(tipos[r.tipo]||0)+1);const maxT=Math.max(1,...Object.values(tipos));
  const meses=[],d=new Date();for(let i=5;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);meses.push({k:iso(x).slice(0,7),t:x.toLocaleDateString('es-MX',{month:'short',year:'2-digit'})})}

  <div class="grid">${kpi(minutos,'Minutos de mantenimiento')}${kpi(paro,'Minutos de paro por fallas')}${kpi(mttr===null?'—':mttr+' min','MTTR · tiempo medio de reparación')}${kpi(mtbf===null?'—':mtbf+' días','MTBF · tiempo medio entre fallas')}</div>

  <div class="card"><h2>Registros por tipo</h2>${Object.keys(tipos).length?Object.entries(tipos).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<div class="barra"><span>${esc(t)}</span><div class="pista"><div class="relleno" style="width:${100*c/maxT}%"></div></div><b>${c}</b></div>`).join(''):'<p class="muted">Sin registros todavía.</p>'}</div>

// ===== QR =====
function urlQR(id){return URL_BASE+'?m='+maq(id).clave}
function pintarQR(id,boxId,size){const box=$(boxId);if(!box)return;box.innerHTML='';
  if(typeof QRCode==='undefined'){box.innerHTML='<small class="muted">No se pudo cargar el generador de QR.</small>';return}
  new QRCode(box,{text:urlQR(id),width:size||180,height:size||180,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function qrDataURL(id){const tmp=document.createElement('div');tmp.id='qrtmp';tmp.style.position='absolute';tmp.style.left='-9999px';document.body.appendChild(tmp);pintarQR(id,'qrtmp',512);
  const c=tmp.querySelector('canvas');const m=maq(id);const out=document.createElement('canvas');out.width=640;out.height=760;const g=out.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,640,760);g.imageSmoothingEnabled=false;if(c)g.drawImage(c,64,64,512,512);
  g.fillStyle='#8f1734';g.font='bold 34px -apple-system,Arial';g.textAlign='center';g.fillText(m.nombre+' · '+m.zona,320,630);
  g.fillStyle='#1c2833';g.font='26px -apple-system,Arial';g.fillText('La Josefina DPC · Planta '+m.planta+' · '+m.id,320,675);g.font='22px -apple-system,Arial';g.fillText('Escanea para ver la ficha y registrar mantenimiento',320,715);
  tmp.remove();return out.toDataURL('image/png')}
